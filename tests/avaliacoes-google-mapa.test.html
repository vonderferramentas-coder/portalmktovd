<!doctype html>
<html><head><meta charset="utf-8"><title>Teste do mapa de lojas</title></head>
<body data-result="running">RUNNING
<script src="../vendor/leaflet/leaflet.js"></script>
<script type="module">
// Exige --allow-file-access-from-files no Chrome (import de módulo via file://).
import { LOJAS, lojaDaFicha, desenharMapa } from '../avaliacoes-google-mapa.js';

const eq = (a, b, msg) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg}: esperado ${JSON.stringify(b)}, veio ${JSON.stringify(a)}`); };

try {
  // geografia: Porto Alegre fica ao sul de Curitiba; Joinville a leste e ao sul de Curitiba; todas no Sul do Brasil
  if (!(LOJAS['porto alegre'].lat < LOJAS['curitiba'].lat)) throw new Error('Porto Alegre deve ficar ao sul de Curitiba');
  if (!(LOJAS['joinville'].lon > LOJAS['curitiba'].lon && LOJAS['joinville'].lat < LOJAS['curitiba'].lat)) throw new Error('Joinville fica a leste e ao sul de Curitiba');
  Object.entries(LOJAS).forEach(([k, l]) => { if (l.lat > -22 || l.lat < -34 || l.lon > -47 || l.lon < -58) throw new Error(`${k} fora do Sul do Brasil`); });

  // ficha do Google -> loja, pelo título ou pela cidade, com apelido ("POA") e sem confundir
  eq(lojaDaFicha({ title: 'FG Curitiba' }), 'curitiba', 'título com a cidade');
  eq(lojaDaFicha({ title: 'Ferramentas Gerais POA' }), 'porto alegre', 'apelido POA');
  eq(lojaDaFicha({ title: 'Loja 3', cidade: 'Caxias do Sul' }), 'caxias do sul', 'cidade da ficha');
  eq(lojaDaFicha({ title: 'FG São Paulo', cidade: 'São Paulo' }), '', 'cidade fora da tabela');
  eq(lojaDaFicha({ title: 'Joinvillense Pioneiro' }), '', 'palavra inteira, não pedaço');

  // desenho: um ping por loja conhecida (a desconhecida fica de fora), com o número, o nome e a bolinha; clique e Espaço chamam o callback
  const clicados = [];
  const el = desenharMapa({ pings: [{ chave: 'curitiba', nome: 'Curitiba', texto: '3', status: 'ok', dica: 'x' }, { chave: 'sao paulo', nome: 'SP', texto: '1', dica: 'y' }], selecionada: 'curitiba', aoEscolher: k => clicados.push(k), chaveVisao: 'teste' });
  eq(el.querySelectorAll('.ag-ping').length, 1, 'só a loja conhecida vira ping');
  const ping = el.querySelector('.ag-ping');
  eq([ping.querySelector('.ag-ping-num').textContent, ping.querySelector('.ag-ping-nome').textContent, !!ping.querySelector('.ag-status.is-ok')], ['3', 'Curitiba', true], 'número, nome e bolinha no pin');
  eq([ping.getAttribute('aria-pressed'), ping.classList.contains('is-sel'), ping.getAttribute('role')], ['true', true, 'button'], 'selecionado marcado');
  eq(el.querySelectorAll('.leaflet-tile-pane').length, 1, 'camada de tiles criada');
  ping.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  ping.dispatchEvent(new KeyboardEvent('keydown', { key: ' ', bubbles: true }));
  eq(clicados, ['curitiba', 'curitiba'], 'clique e Espaço escolhem a loja');

  // cidades coladas (Novo Hamburgo): o pin sai deslocado para a direita, com fio e ponto no lugar real; os demais não
  const el2 = desenharMapa({ pings: [{ chave: 'novo hamburgo', nome: 'Novo Hamburgo', texto: '4,2', dica: 'a' }, { chave: 'curitiba', nome: 'Curitiba', texto: '4', dica: 'b' }], selecionada: '', aoEscolher: () => {}, chaveVisao: 'teste2' });
  const [nh, cwb] = ['novo hamburgo', 'curitiba'].map(n => [...el2.querySelectorAll('.ag-ping')].find(p => p.querySelector('.ag-ping-nome').textContent.toLowerCase() === n));
  eq([!!nh.querySelector('.ag-ping-fio'), !!nh.querySelector('.ag-ping-ponto'), !!cwb.querySelector('.ag-ping-fio')], [true, true, false], 'só o pin deslocado tem fio e ponto');
  eq([nh.style.marginLeft, cwb.style.marginLeft], ['15px', '-19px'], 'a âncora do ícone desloca o pin 34px para a direita');

  document.body.dataset.result = 'pass'; document.body.textContent = 'PASS';
} catch (e) { document.body.dataset.result = 'fail'; document.body.textContent = 'FAIL ' + e.message; }
</script>
</body></html>
