<!doctype html>
<html><head><meta charset="utf-8"><title>Teste das regras de avaliações</title></head>
<body data-result="running">RUNNING
<script type="module">
// Exige --allow-file-access-from-files no Chrome (import de módulo via file://).
import { classificar, porPrioridade, tempoRelativo, palavrasChave, citaPalavra, ordenarAvaliacoes, textoOriginal, abreviar, buscaAvaliacao } from '../avaliacoes-google-regras.js';

const agora = Date.parse('2026-10-28T12:00:00Z');
const rec = (s, t, c, r = '') => ({ s, t, c, r });
const eq = (a, b, msg) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg}: esperado ${JSON.stringify(b)}, veio ${JSON.stringify(a)}`); };

try {
  eq(classificar(rec(1, '', '2026-10-28T10:00:00Z'), agora).nivel, 'critica', '1 estrela é crítica');
  eq(classificar(rec(5, 'Vou no PROCON, é um golpe', '2026-10-28T10:00:00Z'), agora).nivel, 'critica', 'palavra de alerta vence a nota 5');
  eq(classificar(rec(5, 'Péssimo? Não, ótimo!', '2026-10-28T10:00:00Z'), agora).nivel, 'critica', 'acento e caixa são ignorados (heurística: não entende negação)');
  const mista = classificar(rec(4, 'Gostei, mas a demora foi grande', '2026-10-28T10:00:00Z'), agora);
  eq([mista.nivel, mista.motivos], ['atencao', ['nota alta, mas contém "demora"']], 'nota alta com texto negativo pede atenção');
  eq(classificar(rec(3, '', '2026-10-28T10:00:00Z'), agora).nivel, 'atencao', '3 estrelas pede atenção');
  eq(classificar(rec(5, 'Atendimento excelente', '2026-10-28T10:00:00Z'), agora).nivel, 'elogio', 'elogio simples');
  eq(classificar(rec(5, 'Estou decepcionado? nunca! Amei', '2026-10-28T10:00:00Z'), agora).nivel, 'atencao', 'prefixo "decepcion" pega "decepcionado"');
  eq(classificar(rec(5, 'Comprei um carrinho', '2026-10-28T10:00:00Z'), agora).nivel, 'elogio', 'palavra curta só casa no início ("caro" não pega "carrinho")');
  eq(classificar(rec(5, 'A Carolina atendeu muito bem', '2026-10-28T10:00:00Z'), agora).nivel, 'elogio', '"caro" é palavra inteira: não pega "Carolina"');
  eq(classificar(rec(5, 'Achei caro', '2026-10-28T10:00:00Z'), agora).nivel, 'atencao', 'palavra inteira "caro" pega');
  eq(classificar(rec(5, 'Empresa gerida com péssima índole', '2026-10-28T10:00:00Z'), agora).nivel, 'critica', '"péssima" também é alerta');
  eq(classificar(rec(5, 'Sem nenhum defeito, nunca tive problema, não é golpe', '2026-10-28T10:00:00Z'), agora).nivel, 'elogio', 'negação antes da palavra anula o alerta');
  eq(classificar(rec(5, 'Tive um defeito e não resolveram', '2026-10-28T10:00:00Z'), agora).nivel, 'atencao', 'sem negação antes, continua marcando');
  eq(classificar(rec(5, 'Não gostei. Produto quebrou na primeira semana', '2026-10-28T10:00:00Z'), agora).nivel, 'atencao', 'negação de outra frase não anula o alerta');
  eq(classificar(rec(5, 'Não, o atendimento foi horrível', '2026-10-28T10:00:00Z'), agora).nivel, 'critica', 'vírgula separa a negação do alerta');
  eq(classificar(rec(0, '', '2026-10-28T10:00:00Z'), agora).nivel, 'elogio', 'sem nota e sem texto não alarma');

  eq(classificar(rec(1, '', '2026-10-20T12:00:00Z'), agora).atrasada, true, 'negativa sem resposta há 8 dias está atrasada');
  eq(classificar(rec(1, '', '2026-10-28T00:00:00Z'), agora).atrasada, false, 'dentro das 48 h não está atrasada');
  eq(classificar(rec(1, '', '2026-10-20T12:00:00Z', 'Sentimos muito'), agora).atrasada, false, 'respondida nunca está atrasada');
  eq(classificar(rec(5, '', '2026-10-01T12:00:00Z'), agora).atrasada, false, 'elogio sem resposta não é atraso');

  const itens = [rec(1, '', '2026-10-27T10:00:00Z'), rec(3, '', '2026-10-20T10:00:00Z'), rec(1, '', '2026-10-20T10:00:00Z')].map(r => ({ rec: r, cls: classificar(r, agora) }));
  eq(itens.sort(porPrioridade).map(i => i.rec.c.slice(0, 10) + i.rec.s), ['2026-10-201', '2026-10-271', '2026-10-203'], 'ordem: atrasadas críticas, críticas, atenção');

  // texto traduzido pelo Google: fica só o original, venha antes ou depois do aviso
  eq(textoOriginal('Ótimo atendimento\n\n(Translated by Google)\nGreat service'), 'Ótimo atendimento', 'original antes do aviso: corta a tradução');
  eq(textoOriginal('(Translated by Google) Great service\n\n(Original)\nÓtimo atendimento'), 'Ótimo atendimento', 'tradução antes: fica o original');
  eq(textoOriginal('(Traduzido pelo Google) Muito bom (Original) Very good'), 'Very good', 'aviso em português');
  eq(textoOriginal('(Translated by Google) Only translated'), 'Only translated', 'só tradução, sem original: tira o aviso');
  eq([textoOriginal('Ótimo atendimento'), textoOriginal(''), textoOriginal(undefined)], ['Ótimo atendimento', '', ''], 'texto comum não muda');
  eq([0, 193, 999, 1000, 4832, 15208].map(abreviar), ['0', '193', '999', '1 mil', '4,8 mil', '15,2 mil'], 'contagem abreviada');
  // busca no referencial da loja
  const aval = { t: 'Atendimento ótimo na entrega', n: 'João Pedro', r: 'Obrigado pela avaliação' };
  eq(['', '  ', 'atendimento', 'ATENDIMENTO OTIMO', 'joao', 'obrigado', 'entrega rapida', 'frete'].map(q => buscaAvaliacao(aval, q)), [true, true, true, true, true, true, false, false], 'busca: todas as palavras, sem acento nem caixa, em texto, nome e resposta');
  // referencial da loja
  eq(['2026-10-28T08:00:00Z', '2026-10-27T08:00:00Z', '2026-10-24T12:00:00Z', '2026-10-14T12:00:00Z', '2026-08-28T12:00:00Z', '2026-03-28T12:00:00Z', '2024-10-01T12:00:00Z', '2026-10-30T12:00:00Z', '2025-11-03T12:00:00Z', 'texto'].map(d => tempoRelativo(d, agora)),
    ['hoje', 'um dia atrás', '4 dias atrás', '2 semanas atrás', '2 meses atrás', '7 meses atrás', '2 anos atrás', 'hoje', '11 meses atrás', ''], 'tempo relativo');
  eq(palavrasChave(['Atendimento excelente e rápido', 'Atendimento muito bom', 'Entrega rápida, para mim', 'O atendimento da loja']).map(i => [i.palavra, i.n]), [['atendimento', 3]], 'palavras-chave: só quem aparece em 2+ avaliações, sem palavras de ligação');
  eq(palavrasChave(['Atendimento Atendimento atendimento', 'atendimento']).map(i => i.n), [2], 'a mesma palavra conta uma vez por avaliação');
  eq(citaPalavra({ t: 'Ótimo ATENDIMENTO' }, 'atendimento') && citaPalavra({ t: 'Atenção' }, 'atencao') && !citaPalavra({ t: '' }, 'loja'), true, 'cita palavra sem acento nem caixa');
  const lista = [{ s: 5, t: '', c: '2026-10-01' }, { s: 2, t: 'ruim', c: '2026-10-02' }, { s: 4, t: 'muito bom mesmo', c: '2026-10-03' }, { s: 0, t: '', c: '2026-10-04' }];
  eq(ordenarAvaliacoes(lista, 'relevantes').map(r => r.c.slice(8)), ['03', '02', '04', '01'], 'relevantes: comentário mais longo primeiro, sem comentário por data');
  eq(ordenarAvaliacoes(lista, 'recentes').map(r => r.c.slice(8)), ['04', '03', '02', '01'], 'recentes');
  eq(ordenarAvaliacoes(lista, 'maior').map(r => r.s), [5, 4, 2, 0], 'maior classificação');
  eq(ordenarAvaliacoes(lista, 'menor').map(r => r.s), [2, 4, 5, 0], 'menor classificação deixa "sem nota" por último');
  document.body.dataset.result = 'pass'; document.body.textContent = 'PASS';
} catch (e) { document.body.dataset.result = 'fail'; document.body.textContent = 'FAIL ' + e.message; }
</script>
</body></html>
