<!doctype html>
<meta charset="utf-8">
<title>Teste da paginação do Gerador de Cartazes</title>
<body data-result="running">RUNNING</body>
<script src="../cartaz-pagination.js"></script>
<script>
// Roda em Chrome headless: chrome --headless=new --dump-dom file:///.../tests/cartaz-pagination.test.html
try {
  const { paginate, link, unlink, groupBrand, insertItem, twoCodeColumns } = CartazPagination;
  const eq = (a, b, label) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(label + '\n  esperado: ' + JSON.stringify(b) + '\n  obtido:   ' + JSON.stringify(a)); };
  const groups = (n, brand, codes = 1) => Array.from({ length: n }, (_, i) => ({ title: brand + ' ' + i, rows: Array.from({ length: codes }, () => ({ brand })) }));
  const shape = pagesList => pagesList.map(p => p.format + ':' + p.items.length);

  // Regra de formato e divisão: até 6 = A4; 7 a 9 = A3; 10 a 12 = A4 em duas; acima de 12 = A3
  eq(shape(paginate('X', groups(1))), ['A4:1'], '1 produto');
  eq(shape(paginate('X', groups(6))), ['A4:6'], '6 produtos');
  eq(shape(paginate('X', groups(7))), ['A3:7'], '7 produtos');
  eq(shape(paginate('X', groups(9))), ['A3:9'], '9 produtos');
  eq(shape(paginate('X', groups(10))), ['A4:5', 'A4:5'], '10 produtos');
  eq(shape(paginate('X', groups(12))), ['A4:6', 'A4:6'], '12 produtos');
  eq(shape(paginate('X', groups(13))), ['A3:7', 'A3:6'], '13 produtos');
  eq(paginate('X', groups(13))[0].name, 'X · A3 · pág 1/2', 'nome da página');
  // Listas longas usam duas colunas no A4; o A3 mantém a coluna única mais larga.
  eq([twoCodeColumns(9, false), twoCodeColumns(10, false), twoCodeColumns(12, true)], [false, true, false], 'duas colunas acima de 9 códigos no A4');


  // Última linha incompleta: A4 centraliza 1 card; A3 põe 2 lado a lado (pair) ou 1 na coluna do meio
  let a4 = paginate('X', groups(5))[0].items;
  eq(a4.map(i => i.center), [false, false, false, false, true], 'A4 com 5: último centralizado');
  let a3two = paginate('X', groups(8))[0].items;
  eq(a3two.map(i => i.pair), [false, false, false, false, false, false, true, true], 'A3 com 8: dupla final');
  let a3one = paginate('X', groups(7))[0].items;
  eq([a3one[6].col, a3one[6].gridRow], [1, 2], 'A3 com 7: último na coluna do meio');

  // Card com mais de 20 códigos ganha altura extra quando sozinho na última linha (A4)
  let big = groups(3); big[2].rows = Array.from({ length: 30 }, () => ({ brand: 'X' }));
  let extra = paginate('X', big)[0].items[2];
  eq([extra.center, extra.extraHeight], [true, 88], 'altura extra por códigos (30 → 88px)');
  eq(paginate('X', groups(3))[0].items[2].extraHeight, 0, 'sem extra com poucos códigos');

  // Vincular: 4 + 4 produtos de duas marcas viram 1 folha A3, no lugar da primeira; título/foto editados sobrevivem
  const A = groups(4, 'A'), B = groups(4, 'B'), C = groups(2, 'C');
  let pages = [...paginate('A', A), ...paginate('B', B), ...paginate('C', C)];
  pages[0].items[1].title = 'TITULO EDITADO'; pages[1].items[0].photo = { x: 5, y: 6, scale: 1.5 };
  let linked = link(pages, ['A', 'B']);
  eq(linked.key, 'A + B', 'chave do vínculo');
  eq(linked.pages.map(p => p.brand + '|' + p.format + ':' + p.items.length), ['A + B|A3:8', 'C|A4:2'], 'vínculo 4+4 = 1 A3, C fica');
  eq(linked.pages[0].brands, ['A', 'B'], 'membros do vínculo');
  eq(linked.pages[0].items[1].title, 'TITULO EDITADO', 'título editado preservado');
  eq(linked.pages[0].items[4].photo, { x: 5, y: 6, scale: 1.5 }, 'foto ajustada preservada');
  eq(pages.length, 3, 'lista original não é alterada');

  // Desvincular: cada marca volta às suas páginas; edições preservadas; ordem A, B, C
  let un = unlink(linked.pages, 'A + B');
  eq(un.pages.map(p => p.brand + '|' + p.format + ':' + p.items.length), ['A|A4:4', 'B|A4:4', 'C|A4:2'], 'desvínculo restaura as marcas');
  eq(un.first, 'A', 'primeira marca do vínculo');
  eq(un.pages[0].items[1].title, 'TITULO EDITADO', 'título preservado ao desvincular');
  eq(unlink(pages, 'inexistente'), null, 'chave inexistente');

  // Vínculo que passa de 9 produtos, vira duas folhas A4 (10 a 12) ou A3 (acima de 12)
  eq(shape(link([...paginate('A', groups(6, 'A')), ...paginate('B', groups(5, 'B'))], ['A', 'B']).pages), ['A4:6', 'A4:5'], '6+5 = 11 produtos: A4 em duas folhas');
  eq(shape(link([...paginate('A', groups(8, 'A')), ...paginate('B', groups(8, 'B'))], ['A', 'B']).pages), ['A3:8', 'A3:8'], '8+8 = 16 produtos: A3 em duas folhas');

  eq([groupBrand({ rows: [{ brand: '' }, { brand: 'Z' }] }), groupBrand({ rows: [{}] })], ['Z', 'SEM MARCA'], 'groupBrand');

  // Adicionar item manualmente: entra na paginação da marca (mesma regra de formato/coluna), na posição escolhida
  let baseX = paginate('X', groups(3, 'X'));
  baseX[0].items[1].title = 'EDITADO';
  let insEnd = insertItem(baseX, 'X', { title: 'NOVO', rows: [{ brand: 'X' }] });
  eq(shape(insEnd.pages), ['A4:4'], 'manual no fim: 3+1=4 continua A4');
  eq(insEnd.pages[0].items.map(i => i.group.title), ['X 0', 'X 1', 'X 2', 'NOVO'], 'novo item entra no fim da marca');
  eq(insEnd.pages[0].items[1].title, 'EDITADO', 'título editado sobrevive à inserção manual');

  let before = baseX[0].items[2].group; // 'X 2'
  let insMid = insertItem(baseX, 'X', { title: 'MEIO', rows: [{ brand: 'X' }] }, before);
  eq(insMid.pages[0].items.map(i => i.group.title), ['X 0', 'X 1', 'MEIO', 'X 2'], 'manual entra antes do item escolhido');
  eq(insMid.pages[0].items[1].title, 'EDITADO', 'título editado sobrevive quando insere no meio');
  eq(baseX[0].items.length, 3, 'lista original não é alterada pelo insertItem');

  let baseX6 = paginate('X', groups(6, 'X'));
  eq(shape(insertItem(baseX6, 'X', { title: 'NOVO7', rows: [{ brand: 'X' }] }).pages), ['A3:7'], 'manual faz 6+1=7 virar A3, como no import');

  let pagesAC = [...paginate('A', groups(2, 'A')), ...paginate('C', groups(2, 'C'))];
  eq(insertItem(pagesAC, 'B', { title: 'B 0', rows: [{ brand: 'B' }] }).pages.map(p => p.brand), ['A', 'B', 'C'], 'marca nova entra em ordem alfabética entre as existentes');
  eq(insertItem(pagesAC, 'Z', { title: 'Z 0', rows: [{ brand: 'Z' }] }).pages.map(p => p.brand), ['A', 'C', 'Z'], 'marca nova entra no fim quando é a última em ordem alfabética');

  // Configuração do cartaz (Live Shop): 19 por A4 em 4 colunas; A3 automático = 28 em 5 colunas; padrão da Feira = 6/2 e 9/3
  eq([CartazPagination.resolve({}).capA3, CartazPagination.resolve({}).colsA3], [9, 3], 'A3 automático reproduz a Feira (9 em 3 colunas)');
  CartazPagination.setConfig({ capA4: 19, colsA4: 4 });
  let live = CartazPagination.resolve({ capA4: 19, colsA4: 4 });
  eq([live.capA3, live.colsA3], [28, 5], 'A3 automático do Live Shop (19 -> 28, 4 -> 5 colunas)');
  eq(shape(paginate('X', groups(19))), ['A4:19'], 'Live Shop: 19 cabem em 1 A4');
  eq(shape(paginate('X', groups(20))), ['A3:20'], 'Live Shop: 20 vão para 1 A3');
  eq(shape(paginate('X', groups(38))), ['A4:19', 'A4:19'], 'Live Shop: 38 = A4 em duas folhas');
  eq(shape(paginate('X', groups(40))), ['A3:20', 'A3:20'], 'Live Shop: 40 = A3 em duas folhas');
  eq(shape(paginate('X', groups(60))), ['A3:20', 'A3:20', 'A3:20'], 'Live Shop: 60 = A3 em tres folhas');
  let livePage = paginate('X', groups(19))[0];
  eq([livePage.cols, livePage.rows, livePage.capacity], [4, 5, 19], 'Live Shop: grade 4 x 5');
  eq(livePage.items.map(i => i.center || i.pair), Array(19).fill(false), 'Live Shop: sem centralizar a última linha');
  eq([livePage.items[18].col, livePage.items[18].gridRow], [2, 4], 'Live Shop: último item na linha 5, coluna 3');
  CartazPagination.setConfig({ capA4: 6, colsA4: 2, a3Auto: false, capA3: 10, colsA3: 2 });
  eq(shape(paginate('X', groups(10))), ['A3:10'], 'A3 manual: 10 cabem no A3 de 10');
  CartazPagination.setConfig({ sheetFormats: 'a4' });
  eq(shape(paginate('X', groups(14))), ['A4:5', 'A4:5', 'A4:4'], 'somente A4: nunca vira A3, divide em folhas A4');
  CartazPagination.setConfig({ sheetFormats: 'a3' });
  eq(shape(paginate('X', groups(4))), ['A3:4'], 'somente A3: até uma ficha pequena sai em A3');
  CartazPagination.setConfig(CartazPagination.DEFAULT_CONFIG);
  eq(shape(paginate('X', groups(10))), ['A4:5', 'A4:5'], 'voltando ao padrão: regra da Feira intacta');

  // Live Shop com box de logo: a logo ocupa a 1ª célula; 19 produtos + logo = 20 células em 4 x 5
  CartazPagination.setConfig({ capA4: 19, colsA4: 4, layout: 'liveshop', logoBox: true });
  let lp = paginate('X', groups(19))[0];
  eq([lp.rows, lp.layout, lp.logoBox], [5, 'liveshop', true], 'Live Shop: 5 linhas, layout e box de logo na página');
  eq([lp.items[0].col, lp.items[0].gridRow, lp.items[2].col, lp.items[2].gridRow], [1, 0, 3, 0], 'Live Shop: 3 produtos ao lado da logo na 1a linha');
  eq([lp.items[3].col, lp.items[3].gridRow, lp.items[18].col, lp.items[18].gridRow], [0, 1, 3, 4], 'Live Shop: 4 por linha depois da 1a');
  CartazPagination.setConfig({ capA4: 19, colsA4: 4, layout: 'liveshop', logoBox: false });
  eq(paginate('X', groups(19))[0].items.map(i => i.gridRow).slice(0, 5), [0, 0, 0, 0, 1], 'Live Shop sem box de logo: 4 produtos na 1a linha');
  // Header completo (acima da grade, não ocupa célula): 16 produtos em 4 x 4; compacto em cantos: a célula do header fica livre
  CartazPagination.setConfig({ capA4: 16, colsA4: 4, layout: 'liveshop', logoBox: true, headerMode: 'full' });
  let fp = paginate('X', groups(16))[0];
  eq([fp.rows, fp.header, fp.logoBox, fp.items[0].col, fp.items[0].gridRow], [4, 'full', false, 0, 0], 'header completo: 4 linhas, produtos desde a célula 0');
  for (const [corner, cell] of [['tl', 0], ['tr', 3], ['bl', 16], ['br', 19]]) {
    CartazPagination.setConfig({ capA4: 19, colsA4: 4, layout: 'liveshop', logoBox: true, headerMode: 'compact', headerCorner: corner });
    let cp = paginate('X', groups(19))[0], used = new Set(cp.items.map(i => i.gridRow * 4 + i.col));
    eq([cp.rows, used.size, used.has(cell)], [5, 19, false], 'header compacto em ' + corner + ': célula ' + cell + ' livre, 19 produtos em 5 linhas');
  }
  CartazPagination.setConfig({ capA4: 19, colsA4: 4, layout: 'liveshop', logoBox: true, headerMode: 'compact', headerCorner: 'br' });
  let few = paginate('X', groups(5))[0]; eq(few.items.some(i => i.gridRow * 4 + i.col === few.rows * 4 - 1), false, 'canto inferior direito livre mesmo com poucos produtos');
  // Destaque (2 colunas): com logo (célula 0) e 4 colunas, o destaque em 3º cabe na linha 0 (colunas 2-3); em 4º não cabe (col 3) e a vaga é preenchida pelo próximo pequeno
  CartazPagination.setConfig({ capA4: 19, colsA4: 4, layout: 'liveshop', logoBox: true });
  let lw = paginate('X', groups(19))[0], rows0 = lw.rows; lw.items[1].wide = true; CartazPagination.placeLive(lw);
  eq([lw.items[1].col, lw.items[1].gridRow, lw.items[1].span], [2, 0, 2], 'destaque cabe em colunas 2-3');
  lw.items[1].wide = false; lw.items[2].wide = true; lw.items.forEach(i => delete i.wide); lw.items[2].wide = true; CartazPagination.placeLive(lw);
  eq([lw.items[2].col, lw.items[2].gridRow, lw.items[2].span], [0, 1, 2], 'destaque sem espaço na linha vai para a próxima, com vaga preenchida');
  eq(new Set(lw.items.map(i => i.gridRow + ':' + i.col)).size, 19, 'nenhuma célula repetida');
  lw.items.forEach(i => delete i.wide); CartazPagination.placeLive(lw);
  eq(lw.rows, rows0, 'sem destaque, a folha volta ao nº de linhas original');
  CartazPagination.setConfig(CartazPagination.DEFAULT_CONFIG);
  eq(paginate('X', groups(6))[0].layout, undefined, 'Feira não ganha layout liveshop');

  document.body.dataset.result = 'pass';
  document.body.textContent = 'PASS: formato A4/A3, divisão em folhas, última linha, altura extra, vincular, desvincular e inserir item manual';
} catch (error) {
  document.body.dataset.result = 'fail';
  document.body.textContent = 'FAIL: ' + error.message;
}
</script>
