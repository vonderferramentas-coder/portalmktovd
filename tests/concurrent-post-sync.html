<!doctype html>
<meta charset="utf-8">
<title>Teste de sincronização concorrente</title>
<body data-result="running">RUNNING</body>
<script src="../calendario/calendar-post-sync.js"></script>
<script>
(async function(){
  const clone=value=>value==null?value:JSON.parse(JSON.stringify(value));
  const existingPost={id:'card-existing',title:'Card existente',date:'2026-09-11',order:0};
  const server=new Map([[existingPost.id,{post:clone(existingPost),revision:1}]]);
  const listeners=[];
  let conflicts=0;

  function resultFor(id){
    const item=server.get(id);
    return item?{post:clone(item.post),revision:item.revision}:{post:null,revision:0};
  }
  function emit(type,id){
    const result=resultFor(id);
    listeners.forEach(listener=>listener({
      initial:false,fromCache:false,
      changes:[{type,id,...result,pending:false}]
    }));
  }

  window.PortalFirebase={
    ensurePostsStore:async()=>{},
    subscribeToPosts:async(_key,onChange)=>{
      listeners.push(onChange);
      onChange({
        initial:true,fromCache:false,
        changes:Array.from(server,([id,item])=>({type:'added',id,post:clone(item.post),revision:item.revision,pending:false}))
      });
      return ()=>{};
    },
    writePost:async(_key,post,expectedRevision)=>{
      const current=resultFor(post.id);
      if(current.revision!==Number(expectedRevision||0)) return {conflict:true,server:current};
      const revision=current.revision+1;
      server.set(post.id,{post:clone(post),revision});
      emit(current.post?'modified':'added',post.id);
      return {conflict:false,revision};
    },
    deletePost:async(_key,id,expectedRevision)=>{
      const current=resultFor(id);
      if(current.revision!==Number(expectedRevision||0)) return {conflict:true,server:current};
      server.delete(id); emit('removed',id);
      return {conflict:false,revision:0};
    }
  };

  ['test-a','test-b'].forEach(suffix=>{
    localStorage.removeItem('posts-'+suffix);
    localStorage.removeItem('outbox-'+suffix);
  });
  let postsA=[];
  let postsB=[];
  const makeSync=(suffix,getPosts,applyPosts)=>CalendarPostSync.create({
    storeKey:'posts__test',localKey:'posts-'+suffix,outboxKey:'outbox-'+suffix,
    getPosts,applyPosts,readLegacy:async()=>({v:[]}),onRemoteChange:()=>{},onStatus:()=>{},
    onConflict:()=>{conflicts++;}
  });
  const syncA=makeSync('test-a',()=>postsA,value=>{postsA=value;});
  const syncB=makeSync('test-b',()=>postsB,value=>{postsB=value;});
  await Promise.all([syncA.start(),syncB.start()]);

  postsA.find(post=>post.id==='card-existing').title='Card existente editado';
  syncA.save();
  await new Promise(resolve=>setTimeout(resolve,100));
  if(server.get('card-existing').post.title!=='Card existente editado') throw new Error('edição de card carregado não chegou ao servidor');

  postsA.push({id:'card-a',title:'Criado por A',date:'2026-09-11',order:0});
  postsB.push({id:'card-b',title:'Criado por B',date:'2026-09-11',order:0});
  syncA.save(); syncB.save();
  await new Promise(resolve=>setTimeout(resolve,100));
  if(server.size!==3||postsA.length!==3||postsB.length!==3) throw new Error('criações simultâneas não convergiram');

  syncA.beginEdit('card-a'); syncB.beginEdit('card-a');
  postsA.find(post=>post.id==='card-a').title='Edição A';
  postsB.find(post=>post.id==='card-a').title='Edição B';
  syncA.save(); syncB.save();
  syncA.endEdit('card-a'); syncB.endEdit('card-a');
  await new Promise(resolve=>setTimeout(resolve,100));
  const titleA=postsA.find(post=>post.id==='card-a').title;
  const titleB=postsB.find(post=>post.id==='card-a').title;
  if(titleA!==titleB||conflicts!==1) throw new Error('edição do mesmo card não foi isolada por revisão');

  // Regressão do atalho "Abrir editor de posts direto" (datas comemorativas, ver app.js): ele
  // navega pra post-editor.html logo após criar o card, então precisa que flush() só resolva
  // depois da gravação confirmar no servidor - sem isso o card nunca chegava a existir no Firestore.
  postsA.push({id:'card-direct',title:'Criado com flush direto',date:'2026-09-11',order:0});
  syncA.save();
  await syncA.flush();
  if(!server.has('card-direct')) throw new Error('flush() resolveu antes da gravação confirmar no servidor');

  // Regressão (17/11/2026, perfil de social mídia na FG): imagens de referência em base64 estouram a cota
  // do localStorage. Isso não pode impedir de salvar o card (o setItem lançava antes de chegar ao servidor)
  // nem de receber cards de outras pessoas (o setItem lançava no meio do snapshot e a tela ficava com 1 card).
  const realSetItem=Storage.prototype.setItem;
  Storage.prototype.setItem=function(key,value){
    if(String(value).length>50000){ const error=new Error('cota estourada'); error.name='QuotaExceededError'; throw error; }
    return realSetItem.call(this,key,value);
  };
  try{
    postsA.push({id:'card-big',title:'Com imagens',date:'2026-09-11',order:0,referenceImages:[{name:'a.png',dataUrl:'data:image/png;base64,'+'A'.repeat(100000)}]});
    syncA.save();
    await syncA.flush();
    const sent=server.get('card-big');
    if(!sent||sent.post.referenceImages.length!==1) throw new Error('com a cota cheia, o card com imagens não chegou inteiro ao servidor');
    const cached=JSON.parse(localStorage.getItem('posts-test-a')).find(post=>post.id==='card-big');
    if(!cached||cached.referenceImages.length!==0) throw new Error('com a cota cheia, o cache local devia guardar o card sem as imagens');
    if(!postsB.some(post=>post.id==='card-big')) throw new Error('com a cota cheia, o card de outra pessoa não chegou à tela');
    // Recarga com a cota cheia: o cache tem o card SEM imagens. Editar antes do 1º snapshot não pode apagar as
    // imagens do servidor (a edição sai com revisão 0, o servidor recusa e a versão dele prevalece).
    let postsC=JSON.parse(localStorage.getItem('posts-test-a')); // exatamente o que a recarga leria
    const syncC=CalendarPostSync.create({
      storeKey:'posts__test',localKey:'posts-test-c',outboxKey:'outbox-test-c',
      getPosts:()=>postsC,applyPosts:value=>{postsC=value;},readLegacy:async()=>({v:[]}),
      onRemoteChange:()=>{},onStatus:()=>{},onConflict:()=>{conflicts++;}
    });
    syncC.beginEdit('card-big');
    postsC.find(post=>post.id==='card-big').title='Editado antes do 1º snapshot';
    syncC.save();
    await syncC.start();
    await syncC.flush();
    await new Promise(resolve=>setTimeout(resolve,100));
    if(server.get('card-big').post.referenceImages.length!==1) throw new Error('editar antes do 1º snapshot, com cache sem imagens, apagou as imagens do servidor');
  }finally{ Storage.prototype.setItem=realSetItem; }

  document.body.dataset.result='pass';
  document.body.textContent='PASS: edição de card carregado chega ao servidor; criações simultâneas persistem; edição concorrente gera conflito isolado; flush() espera a gravação confirmar; cota cheia do localStorage não bloqueia salvar nem receber cards.';
})().catch(error=>{
  document.body.dataset.result='fail';
  document.body.textContent='FAIL: '+error.message;
});
</script>
