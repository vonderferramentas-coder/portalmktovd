<!doctype html>
<html><head><meta charset="utf-8"><title>Teste do agendador</title></head>
<body data-result="running">RUNNING
<script type="module">
// Exige --allow-file-access-from-files no Chrome (import de módulo via file://).
import { agendaDoMomento, disparar } from '../cloudflare-agendador.js';

const em = iso => agendaDoMomento(new Date(iso)).map(i => `${i.workflow}:${i.rotina}`);
const eq = (a, b, msg) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg}: esperado ${JSON.stringify(b)}, veio ${JSON.stringify(a)}`); };

try {
  eq(em('2026-10-06T02:50:00Z'), ['sync-youtube-followers.yml:false'], 'fechamento YouTube 23:50 SP');
  eq(em('2026-10-06T02:55:00Z'), ['sync-meta-followers.yml:false'], 'fechamento Meta 23:55 SP');
  eq(em('2026-10-06T02:05:00Z'), ['sync-meta-followers.yml:true'], 'rotina Meta não fecha o dia');
  eq(em('2026-10-06T03:35:00Z'), ['sync-youtube-followers.yml:true'], 'rotina YouTube');
  eq(em('2026-10-06T04:40:00Z'), ['sync-youtube-mencoes.yml:true'], 'menções em hora par');
  eq(em('2026-10-06T05:40:00Z'), [], 'menções não rodam em hora ímpar');
  eq(em('2026-10-06T13:00:00Z'), [], 'minuto sem tarefa');
  eq(em('2026-10-06T12:10:00Z'), ['sync-meta-posts.yml:undefined'], 'posts do Instagram às 12 UTC');
  eq(em('2026-10-06T00:25:00Z'), ['sync-youtube-videos.yml:undefined'], 'vídeos do YouTube às 00 UTC');
  eq(em('2026-10-06T06:10:00Z'), [], 'posts não rodam às 06 UTC');
  eq(em('2026-10-06T07:00:00Z'), ['backup-portalstore.yml:undefined'], 'backup às 04:00 SP');
  eq(em('2026-10-06T07:30:00Z'), ['limpar-artes-salvas.yml:undefined'], 'limpeza das artes salvas às 04:30 SP, depois do backup');
  eq(em('2026-10-06T06:15:00Z'), ['sync-google-trends.yml:undefined'], 'tendências antes da coleta das :35');
  eq(em('2026-10-06T06:30:00Z'), [], 'nada às 06:30');

  // Dia inteiro (cron de 5 em 5 min): 24 Meta + 24 YouTube de rotina, 12 menções, 2 fechamentos.
  let total = {}, fechamentos = 0;
  for (let t = Date.UTC(2026, 9, 6); t < Date.UTC(2026, 9, 7); t += 5 * 60000) {
    for (const item of agendaDoMomento(new Date(t))) {
      total[item.workflow] = (total[item.workflow] || 0) + 1;
      if (item.rotina === false) fechamentos++;
    }
  }
  const ordenado = objeto => Object.fromEntries(Object.entries(objeto).sort());
  eq(ordenado(total), ordenado({
    'sync-meta-followers.yml': 25, 'sync-youtube-followers.yml': 25, 'sync-youtube-mencoes.yml': 12,
    'sync-meta-posts.yml': 2, 'sync-meta-facebook-posts.yml': 2, 'sync-youtube-videos.yml': 2,
    'aggregate-usage-metrics.yml': 1, 'sync-youtube-analytics-diario.yml': 1, 'sync-google-trends.yml': 1,
    'backup-portalstore.yml': 1, 'limpar-artes-salvas.yml': 1, 'reconstruir-historico.yml': 1, 'reconstruir-historico-facebook.yml': 1
  }), 'disparos por dia');
  eq(fechamentos, 2, 'fechamentos por dia');

  // Repetição do disparo: fetch simulado, sem esperar de verdade.
  const item = { workflow: 'sync-meta-followers.yml', rotina: false };
  const semEspera = () => Promise.resolve();
  const tentativas = async respostas => {
    let chamadas = 0, ultimo = null;
    globalThis.fetch = async (url, init) => {
      ultimo = JSON.parse(init.body);
      const r = respostas[chamadas++];
      if (r === 'rede') throw new Error('sem rede');
      return { status: r, text: async () => '' };
    };
    const log = console.error; console.error = () => {};
    await disparar({ GITHUB_DISPATCH_TOKEN: 'x' }, item, semEspera);
    console.error = log;
    return { chamadas, ultimo };
  };
  eq((await tentativas([204])).chamadas, 1, 'sucesso de primeira');
  eq((await tentativas([500, 500, 204])).chamadas, 3, '5xx repete até dar certo');
  eq((await tentativas(['rede', 204])).chamadas, 2, 'falha de rede repete');
  eq((await tentativas([429, 204])).chamadas, 2, '429 repete');
  eq((await tentativas([500, 500, 500, 204])).chamadas, 3, 'no máximo 3 tentativas');
  eq((await tentativas([401, 204])).chamadas, 1, '401 não repete');
  eq((await tentativas([422, 204])).chamadas, 1, '422 não repete');
  eq((await tentativas([204])).ultimo, { ref: 'main', inputs: { rotina: 'false' } }, 'corpo do disparo');
  const semEntrada = [];
  globalThis.fetch = async (url, init) => { semEntrada.push(JSON.parse(init.body)); return { status: 204 }; };
  await disparar({ GITHUB_DISPATCH_TOKEN: 'x' }, { workflow: 'sync-meta-posts.yml' }, semEspera);
  eq(semEntrada, [{ ref: 'main' }], 'workflow sem entrada rotina não recebe inputs');

  document.body.dataset.result = 'pass';
  document.body.textContent = 'PASS: agenda do Worker (rotina, fechamentos diários e menções) e repetição do disparo.';
} catch (error) {
  document.body.dataset.result = 'fail';
  document.body.textContent = 'FAIL: ' + error.message;
}
</script>
</body></html>
