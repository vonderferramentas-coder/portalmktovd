<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Central de Inteligência — Calendário de Postagens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Space+Grotesk:wght@500;600;700&family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
  <script>document.documentElement.classList.add('auth-pending');</script>
  <script src="firebase-config.js"></script>
  <script type="module" src="auth-guard.js"></script>
  <style>
    /* Dropdowns de filtro (Categoria/Período) — mesmo padrão visual usado em
       followers-dashboard.html (.actions-control/.period-trigger/.period-menu), reaproveitado
       aqui em vez de inventar um componente novo. */
    .actions-control { position: relative }

    .period-trigger {
      height: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font: 700 12px inherit;
      cursor: pointer
    }

    .period-trigger:hover,
    .period-trigger:focus-visible {
      border-color: var(--accent);
      background: var(--accent-weak);
      outline: none
    }

    .period-caret {
      width: 14px;
      height: 14px;
      color: var(--muted);
      margin-left: 2px;
      transition: transform .15s;
      flex: none
    }

    .period-trigger[aria-expanded="true"] .period-caret { transform: rotate(180deg) }

    .period-menu {
      position: absolute;
      left: 0;
      top: calc(100% + 7px);
      z-index: 30;
      min-width: 240px;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .period-menu[hidden] { display: none }

    .period-option {
      display: flex;
      width: 100%;
      align-items: center;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font: 700 12px inherit;
      text-align: left;
      cursor: pointer
    }

    .period-option:hover,
    .period-option:focus-visible { background: var(--surface-muted); outline: none }
    .period-option.is-active { background: var(--accent-weak); color: var(--text) }

    .intel-filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }

    .intel-region-pill {
      height: 40px;
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-muted);
      color: var(--muted);
      font: 700 12px inherit;
    }

    .intel-trends-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; flex-wrap: wrap }

    #trendsTableWrap { overflow: auto; margin-top: 8px }
    #trendsTableWrap table { border-collapse: collapse; width: 100% }
    #trendsTableWrap th, #trendsTableWrap td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; text-align: left }
    #trendsTableWrap th { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
    #trendsTableWrap tbody tr:hover { background: var(--surface-muted) }
    #trendsTableWrap .intel-col-rank { width: 56px; text-align: center; color: var(--muted); font-weight: 700 }
    #trendsTableWrap .intel-col-interest { text-align: right; font-weight: 700 }
    #trendsTableWrap .intel-col-variation { text-align: right }
    .intel-variation-up { color: var(--success); font-weight: 700 }
    .intel-variation-flat { color: var(--text-faint) }
    .intel-matched-products summary { cursor: pointer; color: var(--muted); font-size: 12px }
    .intel-matched-products ul { margin: 6px 0 0; padding-left: 16px; font-size: 12px; color: var(--muted) }

    /* Paginação da tabela — mesmo padrão de #historyPager em followers-dashboard.html. */
    .intel-pager { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px }
    .chevron-btn {
      width: 28px; height: 28px; padding: 0;
      border: 1px solid var(--border-strong); border-radius: 50%;
      background: var(--surface-muted); color: var(--text);
      font-size: 15px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s, border-color .15s
    }
    .chevron-btn:hover, .chevron-btn:focus-visible { background: var(--accent-weak); border-color: var(--accent); outline: none }
    .chevron-btn:disabled { opacity: .4; cursor: default }
    .intel-page-label { font-size: 10px; font-weight: 800; color: var(--muted); background: var(--surface-muted); border-radius: 7px; padding: 5px 8px }

    /* Dropdown do ranking — mesmo padrão de .section-divider/.section-divider-body usado em
       followers-dashboard.html (grid-template-rows 0fr<->1fr anima até a altura real do
       conteúdo sem medir pixels em JS), com margens ajustadas por não atuar como um divisor
       entre duas seções e sim como o cabeçalho clicável de uma única seção. */
    /* Recuo lateral em relação ao card de filtros acima, que ocupa a largura cheia. */
    .intel-trends-wrap { padding: 0 20px }
    .section-divider { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; width: 100%; margin: 0; padding: 0; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer }
    .section-divider:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px }
    .intel-trends-header { display: flex; align-items: center; gap: 20px; text-align: left }
    .intel-trends-icon { flex: none; color: var(--accent-ink) }
    .section-divider h2 { font-size: 17px; margin: 0 0 4px; color: var(--text) }
    .section-divider p { margin: 0 }
    .section-divider-chevron { flex: none; color: var(--muted); margin-top: 4px; transition: transform .15s }
    .section-divider[aria-expanded="true"] .section-divider-chevron { transform: rotate(180deg) }
    /* Risco entre o subtítulo e a tabela — mesmo espaçamento (20px) dos dois lados. */
    .intel-trends-rule { border: 0; border-top: 1px solid var(--border); margin: 20px 0 }
    .section-divider-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .28s ease, opacity .22s ease; opacity: 1 }
    .section-divider-body.is-collapsed { grid-template-rows: 0fr; opacity: 0 }
    .section-divider-body-inner { overflow: hidden; min-height: 0 }
  </style>
</head>

<body>
  <div class="portal-shell">
    <!-- Menu do portal (navegação entre ferramentas + seletor de marca), montado por portal-shell.js -->
    <aside class="portal-sidebar" id="portalSidebar"></aside>
    <div class="portal-main">
      <div class="container">

        <div class="page-header">
          <div>
            <h1>Central de Inteligência</h1>
            <p class="page-subtitle">Dados de tendências e comportamento de busca do mercado.</p>
          </div>
          <div class="page-header-actions">
            <span id="syncStatus" class="sync-status" title="Data/hora da última coleta do Google Trends"></span>
          </div>
        </div>

        <!-- Bloco 1 — Filtros: Categoria e Período são dropdowns; Região tem só "Brasil" nesta
             primeira versão, então vira uma pill estática em vez de um dropdown de uma opção só. -->
        <div class="card" style="margin-bottom:36px">
          <div class="intel-filters">
            <div class="actions-control" id="trendsCategoryControl">
              <button type="button" class="period-trigger" id="trendsCategoryTrigger" aria-expanded="false"
                aria-controls="trendsCategoryMenu">
                <span>Categoria: <strong id="trendsCategoryLabel">Todas as categorias</strong></span>
                <svg class="period-caret" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2.4">
                  <path d="m7 10 5 5 5-5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <div class="period-menu" id="trendsCategoryMenu" hidden>
                <button type="button" class="period-option is-active" data-category="all">Todas as categorias</button>
                <button type="button" class="period-option" data-category="construction-power-tools">Construction &amp;
                  Power Tools</button>
                <button type="button" class="period-option" data-category="home-improvement">Home Improvement</button>
                <button type="button" class="period-option" data-category="yard-patio">Yard &amp; Patio</button>
                <button type="button" class="period-option" data-category="construction-maintenance">Construction &amp;
                  Maintenance</button>
                <button type="button" class="period-option" data-category="automotive">Automotive</button>
                <button type="button" class="period-option" data-category="cleaning-supplies-services">Cleaning Supplies
                  &amp; Services</button>
                <button type="button" class="period-option" data-category="industrial-materials">Industrial
                  Materials</button>
              </div>
            </div>
            <div class="actions-control" id="trendsPeriodControl">
              <button type="button" class="period-trigger" id="trendsPeriodTrigger" aria-expanded="false"
                aria-controls="trendsPeriodMenu">
                <span>Período: <strong id="trendsPeriodLabel">Últimos 30 dias</strong></span>
                <svg class="period-caret" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2.4">
                  <path d="m7 10 5 5 5-5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <div class="period-menu" id="trendsPeriodMenu" hidden>
                <button type="button" class="period-option" data-period="7d">Últimos 7 dias</button>
                <button type="button" class="period-option is-active" data-period="30d">Últimos 30 dias</button>
                <button type="button" class="period-option" data-period="90d">Últimos 90 dias</button>
                <button type="button" class="period-option" data-period="12m">Últimos 12 meses</button>
                <button type="button" class="period-option" data-period="yoy">Comparativo anual</button>
              </div>
            </div>
            <span class="intel-region-pill" title="Nesta primeira versão só o Brasil é monitorado">Região: Brasil</span>
          </div>
        </div>

        <div class="intel-trends-wrap">
          <button type="button" class="section-divider" id="trendsToggle" aria-expanded="false"
            aria-controls="trendsSectionBody">
            <div class="intel-trends-header">
              <svg class="intel-trends-icon" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
                <polyline points="17 6 23 6 23 12" />
              </svg>
              <div>
                <h2>Termos mais pesquisados no Google</h2>
                <p class="page-subtitle" style="font-size:12px">Os dados abaixo são coletados do Google Trends e mostram os termos mais pesquisados no Google dentro do período e da categoria selecionados nos filtros acima.</p>
              </div>
            </div>
            <svg class="section-divider-chevron" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2.4">
              <path d="m7 10 5 5 5-5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <hr class="intel-trends-rule">
          <div class="section-divider-body is-collapsed" id="trendsSectionBody" aria-hidden="true" inert>
            <div class="section-divider-body-inner">
              <!-- Bloco 2 — Ranking de tendências -->
              <div class="card" style="padding:36px">
                <div class="intel-trends-head">
                  <h3 class="fg-label" style="margin:0">Ranking de tendências</h3>
                  <div class="bg-section-desc" id="trendsSummary" style="margin:0"></div>
                </div>
                <div id="trendsEmpty" class="bg-empty" style="display:none"></div>
                <div class="table-wrap" id="trendsTableWrap">
                  <table>
                    <thead>
                      <tr>
                        <th class="intel-col-rank">Ranking</th>
                        <th>Termo</th>
                        <th>Categoria</th>
                        <th class="intel-col-interest">Interesse</th>
                        <th class="intel-col-variation">Variação</th>
                        <th>Período analisado</th>
                        <th>Última atualização</th>
                        <th>Produtos</th>
                      </tr>
                    </thead>
                    <tbody id="trendsTableBody"></tbody>
                  </table>
                </div>
                <div class="intel-pager" id="trendsPager" hidden>
                  <button type="button" class="chevron-btn" id="trendsPagerPrev" aria-label="Página anterior">‹</button>
                  <span class="intel-page-label" id="trendsPagerLabel">Página 1 de 1</span>
                  <button type="button" class="chevron-btn" id="trendsPagerNext" aria-label="Próxima página">›</button>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="sync-backend.js"></script>
  <script src="portal-shell.js"></script>
  <script src="intelligence-center.js"></script>
</body>

</html>
