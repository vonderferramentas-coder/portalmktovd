<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Central de Inteligência — Calendário de Postagens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Space+Grotesk:wght@500;600;700&family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
  <script>document.documentElement.classList.add('auth-pending');</script>
  <script src="firebase-config.js"></script>
  <script type="module" src="auth-guard.js"></script>
  <style>
    /* Dropdowns de filtro (Categoria/Período) — mesmo padrão visual usado em
       followers-dashboard.html (.actions-control/.period-trigger/.period-menu), reaproveitado
       aqui em vez de inventar um componente novo. */
    .actions-control { position: relative }

    .period-trigger {
      height: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font: 700 12px inherit;
      cursor: pointer
    }

    .period-trigger:hover,
    .period-trigger:focus-visible {
      border-color: var(--accent);
      background: var(--accent-weak);
      outline: none
    }

    .period-caret {
      width: 14px;
      height: 14px;
      color: var(--muted);
      margin-left: 2px;
      transition: transform .15s;
      flex: none
    }

    .period-trigger[aria-expanded="true"] .period-caret { transform: rotate(180deg) }

    .period-menu {
      position: absolute;
      left: 0;
      top: calc(100% + 7px);
      z-index: 30;
      min-width: 240px;
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .period-menu[hidden] { display: none }

    .period-option {
      display: flex;
      width: 100%;
      align-items: center;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font: 700 12px inherit;
      text-align: left;
      cursor: pointer
    }

    .period-option:hover,
    .period-option:focus-visible { background: var(--surface-muted); outline: none }
    .period-option.is-active { background: var(--accent-weak); color: var(--text) }

    .intel-filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }

    .intel-region-pill {
      height: 40px;
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-muted);
      color: var(--muted);
      font: 700 12px inherit;
    }

    .intel-trends-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; flex-wrap: wrap }

    #trendsTableWrap { overflow: auto; margin-top: 8px }
    #trendsTableWrap table { border-collapse: collapse; width: 100% }
    #trendsTableWrap th, #trendsTableWrap td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; text-align: left }
    #trendsTableWrap th { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
    #trendsTableWrap tbody tr:hover { background: var(--surface-muted) }
    #trendsTableWrap .intel-col-rank { width: 56px; text-align: center; color: var(--muted); font-weight: 700 }
    #trendsTableWrap .intel-col-interest { text-align: right; font-weight: 700 }
    #trendsTableWrap .intel-col-variation { text-align: right }
    .intel-variation-up { color: var(--success); font-weight: 700 }
    .intel-variation-flat { color: var(--text-faint) }
  </style>
</head>

<body>
  <div class="portal-shell">
    <!-- Menu do portal (navegação entre ferramentas + seletor de marca), montado por portal-shell.js -->
    <aside class="portal-sidebar" id="portalSidebar"></aside>
    <div class="portal-main">
      <div class="container">

        <div class="page-header">
          <div>
            <h1>Central de Inteligência</h1>
            <p class="page-subtitle">Dados de tendências e comportamento de busca do mercado.</p>
          </div>
          <div class="page-header-actions">
            <span id="syncStatus" class="sync-status" title="Data/hora da última coleta do Google Trends"></span>
          </div>
        </div>

        <!-- Bloco 1 — Filtros: Categoria e Período são dropdowns; Região tem só "Brasil" nesta
             primeira versão, então vira uma pill estática em vez de um dropdown de uma opção só. -->
        <div class="card" style="margin-bottom:16px">
          <div class="intel-filters">
            <div class="actions-control" id="trendsCategoryControl">
              <button type="button" class="period-trigger" id="trendsCategoryTrigger" aria-expanded="false"
                aria-controls="trendsCategoryMenu">
                <span>Categoria: <strong id="trendsCategoryLabel">Todas as categorias</strong></span>
                <svg class="period-caret" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2.4">
                  <path d="m7 10 5 5 5-5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <div class="period-menu" id="trendsCategoryMenu" hidden>
                <button type="button" class="period-option is-active" data-category="all">Todas as categorias</button>
                <button type="button" class="period-option" data-category="construction-power-tools">Construction &amp;
                  Power Tools</button>
                <button type="button" class="period-option" data-category="home-improvement">Home Improvement</button>
                <button type="button" class="period-option" data-category="yard-patio">Yard &amp; Patio</button>
                <button type="button" class="period-option" data-category="construction-maintenance">Construction &amp;
                  Maintenance</button>
                <button type="button" class="period-option" data-category="automotive">Automotive</button>
                <button type="button" class="period-option" data-category="cleaning-supplies-services">Cleaning Supplies
                  &amp; Services</button>
                <button type="button" class="period-option" data-category="industrial-materials">Industrial
                  Materials</button>
              </div>
            </div>
            <div class="actions-control" id="trendsPeriodControl">
              <button type="button" class="period-trigger" id="trendsPeriodTrigger" aria-expanded="false"
                aria-controls="trendsPeriodMenu">
                <span>Período: <strong id="trendsPeriodLabel">Últimos 30 dias</strong></span>
                <svg class="period-caret" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2.4">
                  <path d="m7 10 5 5 5-5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <div class="period-menu" id="trendsPeriodMenu" hidden>
                <button type="button" class="period-option" data-period="7d">Últimos 7 dias</button>
                <button type="button" class="period-option is-active" data-period="30d">Últimos 30 dias</button>
                <button type="button" class="period-option" data-period="90d">Últimos 90 dias</button>
                <button type="button" class="period-option" data-period="12m">Últimos 12 meses</button>
                <button type="button" class="period-option" data-period="yoy">Comparativo anual</button>
              </div>
            </div>
            <span class="intel-region-pill" title="Nesta primeira versão só o Brasil é monitorado">Região: Brasil</span>
          </div>
        </div>

        <!-- Bloco 2 — Ranking de tendências -->
        <div class="card">
          <div class="intel-trends-head">
            <h3 class="fg-label" style="margin:0">Ranking de tendências</h3>
            <div class="bg-section-desc" id="trendsSummary" style="margin:0"></div>
          </div>
          <div id="trendsEmpty" class="bg-empty" style="display:none"></div>
          <div class="table-wrap" id="trendsTableWrap">
            <table>
              <thead>
                <tr>
                  <th class="intel-col-rank">Ranking</th>
                  <th>Termo</th>
                  <th>Categoria</th>
                  <th class="intel-col-interest">Interesse</th>
                  <th class="intel-col-variation">Variação</th>
                  <th>Período analisado</th>
                  <th>Última atualização</th>
                </tr>
              </thead>
              <tbody id="trendsTableBody"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="sync-backend.js"></script>
  <script src="portal-shell.js"></script>
  <script src="intelligence-center.js"></script>
</body>

</html>
