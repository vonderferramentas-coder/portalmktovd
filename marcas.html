<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Marcas</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <script>document.documentElement.classList.add('auth-pending')</script>
  <script src="firebase-config.js"></script>
  <script type="module" src="auth-guard.js"></script>
  <link rel="stylesheet" href="marcas.css">
</head>
<body>
  <div class="portal-shell">
    <aside class="portal-sidebar" id="portalSidebar"></aside>
    <main class="portal-main marcas-app">
      <header class="page-header marcas-header">
        <div>
          <span class="page-kicker">Administração</span>
          <h1>Marcas</h1>
          <p class="page-subtitle">Marcas que aparecem em folhetos, posts e cartazes, com as versões de logo de cada uma. Não são os perfis do portal (VONDER, FG…).</p>
        </div>
        <button type="button" id="newBrand" class="btn" hidden>+ Nova marca</button>
      </header>

      <section class="marcas-panel" aria-label="Biblioteca de marcas">
        <div class="marcas-tools">
          <label class="search-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="brandSearch" placeholder="Buscar marca ou logo…" aria-label="Buscar marca ou logo" autocomplete="off"></label>
          <div class="bg-toggle" role="group" aria-label="Fundo da prévia">
            <button type="button" data-bg="light" aria-pressed="true">Fundo claro</button>
            <button type="button" data-bg="dark" aria-pressed="false">Fundo escuro</button>
          </div>
        </div>
        <p class="marcas-readonly" id="readOnlyNote" hidden>Você pode consultar e baixar os logos, mas só Administração e Criação podem alterar as marcas.</p>
        <nav class="az-index" id="azIndex" aria-label="Ir para a letra" hidden></nav>
        <div id="brandList" class="brand-list" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="brand-drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
    <header class="drawer-head">
      <div><h2 id="drawerTitle"></h2><span id="drawerSub"></span></div>
      <div class="drawer-actions"><button type="button" class="kebab" id="drawerMenu" data-menu-id="brand" aria-haspopup="menu" aria-label="Ações da marca" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button><button type="button" class="drawer-close" id="drawerClose" aria-label="Fechar">&times;</button></div>
    </header>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <dialog class="m-dialog" id="dlg" aria-labelledby="dlgTitle">
    <form method="dialog" id="dlgForm">
      <button type="submit" value="cancel" formnovalidate class="m-close" aria-label="Fechar">&times;</button>
      <h2 id="dlgTitle"></h2>
      <p id="dlgText"></p>
      <div id="dlgFields"></div>
      <datalist id="dlgList"></datalist>
      <div class="m-actions"><button type="submit" value="cancel" formnovalidate class="btn ghost" id="dlgCancel">Cancelar</button><button type="submit" value="ok" class="btn" id="dlgOk">Salvar</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" hidden role="status"></div>

  <script src="portal-shell.js"></script>
  <script src="usage-analytics.js"></script>
  <script src="sync-backend.js"></script>
  <script src="post-editor-assets/brands-manifest.js"></script>
  <script src="brand-library-model.js"></script>
  <script src="brand-export.js"></script>
  <script src="marcas.js"></script>
</body>
</html>
