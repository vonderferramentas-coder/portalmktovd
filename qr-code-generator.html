<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerador de QR Codes</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="auth.css"><script>document.documentElement.classList.add('auth-pending')</script><script src="firebase-config.js"></script><script type="module" src="auth-guard.js"></script><body><div class="portal-shell"><aside class="portal-sidebar" id="portalSidebar"></aside><main class="portal-main" style="max-width:900px;margin:auto"><p class="page-kicker">Criação</p><h1>Gerador de QR Codes</h1><p class="page-subtitle">Gere um QR Code personalizado e baixe em SVG ou PNG.</p><section class="card" style="display:grid;gap:14px;max-width:520px"><label>Link de destino <input id="link" type="url" required placeholder="https://..." style="width:100%;height:42px"></label><label>Cor <input id="color" type="color" value="#111827"></label><button class="btn" id="generate">Gerar QR Code</button><p id="error" role="alert"></p><div id="code" style="background:#fff;padding:16px;width:300px;max-width:100%;box-sizing:border-box"></div><div id="downloads" hidden><button class="btn ghost" id="svg">Baixar SVG</button> <button class="btn ghost" id="png">Baixar PNG</button></div><small>Este QR aponta diretamente para o link. REDIR e métricas serão adicionados depois.</small></section></main></div><script src="portal-shell.js"></script><script src="vendor/qrcode-generator.js"></script><script src="qr-code-generator.js"></script>
