<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Autorização TikTok — Portal de Marketing OVD</title>
  <style>
    :root { color-scheme: light; }
    body { margin:0; padding:0; font-family:system-ui, sans-serif; background:#f7f7f8; color:#1f2328; }
    main { max-width:560px; margin:0 auto; padding:56px 24px; }
    h1 { font-size:1.3rem; font-weight:800; margin-bottom:1rem; }
    p { line-height:1.6; color:#374151; }
    .box { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:16px; margin:1.25rem 0; }
    .code { font-family:ui-monospace, monospace; font-size:.9rem; word-break:break-all; user-select:all; background:#f3f4f6; padding:12px; border-radius:6px; }
    .warn { color:#b91c1c; font-weight:600; }
    .muted { color:#6b7280; font-size:.85rem; }
  </style>
</head>

<body>
  <main>
    <h1>Autorização do TikTok concluída</h1>
    <div id="content">
      <p>Carregando…</p>
    </div>
    <p class="muted">Esta página não envia o código a nenhum lugar — ele fica só nesta tela, no seu navegador.</p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const errorDescription = params.get('error_description');
    const el = document.getElementById('content');

    if (error) {
      el.innerHTML = `
        <p class="warn">A autorização falhou: ${error}</p>
        <p>${errorDescription ? errorDescription.replace(/[<>]/g, '') : ''}</p>
      `;
    } else if (code) {
      el.innerHTML = `
        <p>Copie o código abaixo e volte para quem está te guiando na conexão do TikTok — ele será trocado por um token de acesso.</p>
        <div class="box">
          <div class="code" id="codeBox"></div>
        </div>
        <p class="warn">Este código expira em poucos minutos. Não recarregue esta página.</p>
      `;
      document.getElementById('codeBox').textContent = code;
    } else {
      el.innerHTML = `<p class="warn">Nenhum código de autorização encontrado na URL.</p>`;
    }
  </script>
</body>

</html>
