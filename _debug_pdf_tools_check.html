  <script>
    async function inflateZlib(bytes) {
      var ds = new DecompressionStream("deflate");
      var stream = new Blob([bytes]).stream().pipeThrough(ds);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    function findImageStream(bytes) {
      var needle = Array.from("/ColorSpace /DeviceCMYK").map(function (c) { return c.charCodeAt(0); });
      function indexOfBytes(hay, pat, from) {
        outer: for (var i = from; i <= hay.length - pat.length; i++) {
          for (var j = 0; j < pat.length; j++) if (hay[i + j] !== pat[j]) continue outer;
          return i;
        }
        return -1;
      }
      var csIdx = indexOfBytes(bytes, needle, 0);
      var streamNeedle = Array.from("stream\n").map(function (c) { return c.charCodeAt(0); });
      var streamIdx = indexOfBytes(bytes, streamNeedle, csIdx);
      var streamStart = streamIdx + streamNeedle.length;
      var endNeedle = Array.from("\nendstream").map(function (c) { return c.charCodeAt(0); });
      var streamEnd = indexOfBytes(bytes, endNeedle, streamStart);
      var header = new TextDecoder().decode(bytes.slice(Math.max(0, csIdx - 400), csIdx + 200));
      var widthMatch = header.match(/\/Width (\d+)/);
      var heightMatch = header.match(/\/Height (\d+)/);
      var hasFlate = header.indexOf("FlateDecode") >= 0;
      return { bytes: bytes.slice(streamStart, streamEnd), width: parseInt(widthMatch[1], 10), height: parseInt(heightMatch[1], 10), flate: hasFlate };
    }
    function cmykToCanvas(cmyk, width, height) {
      var canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      var cctx = canvas.getContext("2d");
      var imgData = cctx.createImageData(width, height);
      for (var i = 0, p = 0; i < cmyk.length; i += 4, p += 4) {
        var c = cmyk[i] / 255, m = cmyk[i + 1] / 255, y = cmyk[i + 2] / 255, k = cmyk[i + 3] / 255;
        imgData.data[p] = Math.round(255 * (1 - c) * (1 - k));
        imgData.data[p + 1] = Math.round(255 * (1 - m) * (1 - k));
        imgData.data[p + 2] = Math.round(255 * (1 - y) * (1 - k));
        imgData.data[p + 3] = 255;
      }
      cctx.putImageData(imgData, 0, 0);
      return canvas;
    }
    window.addEventListener("load", async function () {
      try {
        window.BusinessCardGenerator.loadDemo();
        var r = window.BusinessCardGenerator.getState().records[0];
        var pdf = await window.BusinessCardGenerator.createPdf(r);
        var bytes = new Uint8Array(pdf.output("arraybuffer"));
        var img = findImageStream(bytes);
        var cmyk = img.flate ? await inflateZlib(img.bytes) : img.bytes;
        var full = cmykToCanvas(cmyk, img.width, img.height);
        var out = document.getElementById("out");
        out.innerHTML = "<div>full: " + img.width + "x" + img.height + "</div>";
        // area das ferramentas: toolsBox em canvas 1880x1080 -> escala para 2457x1512 (fator ~1.307)
        var scale = img.width / 1880;
        var bx = 622.7064 * scale, by = 524.2927 * scale, bw = 633.2549 * scale, bh = 400.0007 * scale;
        var crop = document.createElement("canvas");
        crop.width = 700; crop.height = 440;
        crop.getContext("2d").drawImage(full, bx - 10, by - 10, bw + 20, bh + 20, 0, 0, 700, 440);
        crop.style.border = "2px solid red";
        out.appendChild(crop);
        // amostra pixels direto do canvas do PDF decodificado (nao do SVG isolado, que da taint)
        var samplePts = [[bx + bw * 0.5, by + bh * 0.3], [bx + bw * 0.65, by + bh * 0.55], [bx + bw * 0.3, by + bh * 0.75]];
        var fctx = full.getContext("2d");
        var lines = [];
        samplePts.forEach(function (p) {
          var d = fctx.getImageData(Math.round(p[0]), Math.round(p[1]), 1, 1).data;
          lines.push(Math.round(p[0]) + "," + Math.round(p[1]) + " -> R=" + d[0] + " G=" + d[1] + " B=" + d[2]);
        });
        var pre = document.createElement("pre");
        pre.textContent = lines.join("\n");
        out.appendChild(pre);
        document.title = "OK";
      } catch (e) {
        document.getElementById("out").textContent = "ERRO: " + e.message;
        document.title = "ERRO";
      }
    });
  </script>
