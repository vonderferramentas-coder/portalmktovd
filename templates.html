<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Templates — Calendário de Postagens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Space+Grotesk:wght@500;600;700&family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
  <script>document.documentElement.classList.add('auth-pending');</script>
  <script src="firebase-config.js"></script>
  <script type="module" src="auth-guard.js"></script>
  <style>
    /* Layout específico desta página — os componentes reutilizáveis (modal, botões, cards de
       formulário) vêm de styles.css; aqui só o que é próprio da tela Templates. */
    .tpl-gallery-row { display: flex; gap: 16px; overflow-x: auto; padding: 4px 4px 10px }

    /* Card do marketplace — proporção 3:4, foto de capa (ou gradiente com a cor da marca
       enquanto a foto não chega, ver cardBackground em templates.js) com um véu escuro por baixo
       pra legibilidade do texto, e um botão pill semi-transparente no rodapé. Borda sutil (em vez
       de 0): marca com cor de identidade bem escura (ex.: TikTok Shop, #010101) quase sumia contra
       o fundo do modo escuro (#121214) — sem contorno nenhum, o card virava um retângulo preto
       sobre um fundo quase preto. */
    .tpl-card {
      position: relative; flex: 0 0 auto; width: 176px; aspect-ratio: 3 / 4;
      border: 1px solid var(--border); border-radius: 20px; overflow: hidden; cursor: pointer; padding: 0;
      background-size: cover; background-position: center; font-family: inherit;
      box-shadow: var(--shadow-md); transition: transform .15s, box-shadow .15s;
    }
    .tpl-card:hover, .tpl-card:focus-visible { transform: translateY(-3px); box-shadow: var(--shadow-lg); outline: none }
    .tpl-card:active { transform: translateY(-1px) }
    .tpl-card-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 38%, rgba(0,0,0,.78) 100%) }
    .tpl-card-body { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px; display: flex; flex-direction: column; gap: 3px; color: #fff; text-align: left }
    .tpl-card-name { font: 800 16px/1.2 var(--font-display); text-shadow: 0 1px 3px rgba(0,0,0,.35) }
    .tpl-card-stats { font-size: 10.5px; font-weight: 600; opacity: .85 }
    .tpl-card-cta {
      margin-top: 9px; display: flex; align-items: center; justify-content: space-between; gap: 6px;
      height: 32px; padding: 0 6px 0 11px; border-radius: 999px; background: rgba(0,0,0,.4);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      font-size: 11.5px; font-weight: 700;
    }
    .tpl-card-cta svg { flex: 0 0 auto }

    /* Canal sem instruções cadastradas ainda (ver isChannelLocked em templates.js) — card em
       tons de cinza, sem hover/clique (tabindex="-1", sem listener — ver renderChannelGallery),
       cadeado no lugar da seta. */
    .tpl-card.is-locked { cursor: not-allowed; filter: grayscale(1); opacity: .8 }
    .tpl-card.is-locked:hover, .tpl-card.is-locked:focus-visible { transform: none; box-shadow: var(--shadow-md) }
    .tpl-card-lock {
      position: absolute; top: 10px; right: 10px; z-index: 1; display: flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff;
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    }

    /* Botão de reticências (editar/duplicar/excluir o card) — só admin (hidden por padrão, ver
       applyAdminVisibility em templates.js). Some pro lado do cadeado quando os dois coexistem
       (canal travado + admin), em vez de sobrepor. */
    .tpl-card-menu-btn {
      position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 999px; border: 0; background: rgba(0,0,0,.45); color: #fff; cursor: pointer;
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); transition: background .12s;
    }
    .tpl-card-menu-btn:hover, .tpl-card-menu-btn:focus-visible { background: rgba(0,0,0,.65); outline: none }
    .tpl-card.is-locked .tpl-card-menu-btn { right: 44px }
    /* [hidden] some vencer o display:flex acima — mesmo gotcha documentado em .portal-nav-item[hidden]
       no styles.css: a regra nativa do navegador pra [hidden] tem prioridade mais baixa que
       qualquer seletor do autor, então precisa ser repetida aqui pra esconder de verdade quem não
       é admin (ver applyAdminVisibility em templates.js). */
    .tpl-card-menu-btn[hidden] { display: none }

    /* Foto de fundo no modal de editar card (nome + foto) — mesma proporção 3:4 do card de
       verdade, pra o admin já ver como vai ficar. Clique em qualquer parte abre o seletor de
       arquivo (label envolvendo um input file escondido, mesmo padrão do "Editar marca" em
       portal-shell.js). */
    .tpl-channel-photo-picker {
      display: block; position: relative; width: 140px; aspect-ratio: 3 / 4; margin: 0 auto 16px;
      border-radius: var(--radius-md); overflow: hidden; cursor: pointer; background: var(--surface-muted);
      border: 1px solid var(--border);
    }
    .tpl-channel-photo-picker-media { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-faint) }
    .tpl-channel-photo-picker-media img { width: 100%; height: 100%; object-fit: cover; display: block }
    .tpl-channel-photo-picker-hint {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 6px; text-align: center;
      font-size: 10.5px; font-weight: 700; color: #fff; background: rgba(0,0,0,.55);
    }

    /* Modal — reaproveita .modal-backdrop/.modal/.modal--wide de styles.css; só o cabeçalho ganha
       a cor de identidade do marketplace clicado (ver openModal em templates.js). --tpl-modal-ink
       é a cor de texto/ícone que contrasta com esse fundo — sem ela, "Voltar" e os botões de
       fechar/adicionar ficavam com var(--muted)/var(--text) do TEMA (claro/escuro), que não tem
       relação nenhuma com o fundo da marca: contra um amarelo bem claro (ex.: Mercado Livre), o
       cinza claro do --muted no modo escuro quase sumia. Os botões herdam a cor do cabeçalho por
       padrão; o hover usa color-mix com a própria cor pra continuar legível em fundo claro OU
       escuro sem precisar de um valor fixo (preto ou branco) que só funcionaria pra um dos dois. */
    .tpl-modal .modal-header { background: var(--tpl-modal-accent, var(--card)); color: var(--tpl-modal-ink, var(--text)); transition: background .15s, color .15s }
    /* h2 tem color:var(--text) direto em styles.css (h1,h2,h3...) — uma regra que MIRA o elemento
       sempre vence a herança do pai, então sem esse override o título ficava sempre na cor do
       tema (branco no modo escuro) por cima do amarelo, ignorando --tpl-modal-ink por completo. */
    .tpl-modal .modal-header h2 { color: var(--tpl-modal-ink, var(--text)) }
    .tpl-modal .modal-header .modal-back-btn,
    .tpl-modal .modal-header .modal-close { color: var(--tpl-modal-ink, var(--muted)) }
    .tpl-modal .modal-header .modal-back-btn:hover,
    .tpl-modal .modal-header .modal-close:hover { background: color-mix(in srgb, var(--tpl-modal-ink, var(--text)) 15%, transparent); color: var(--tpl-modal-ink, var(--text)) }
    .tpl-modal-logo {
      display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
      width: 30px; height: 30px; border-radius: 8px; font: 800 12px/1 var(--font-display);
      border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
    }
    .tpl-modal-modules { display: flex; flex-direction: column; gap: 10px; min-width: 0 }

    /* Tela de escolha da área (Loja Oficial / Ads), primeiro passo dentro do modal — cards
       simples (sem foto, ao contrário do card do marketplace) já que são só duas opções fixas */
    .tpl-category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
    .tpl-category-card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 20px;
      border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface-muted);
      cursor: pointer; text-align: left; font-family: inherit; transition: border-color .12s, background .12s, transform .06s;
    }
    .tpl-category-card:hover, .tpl-category-card:focus-visible { border-color: var(--accent); background: var(--accent-weak); outline: none }
    .tpl-category-card:active { transform: translateY(1px) }
    .tpl-category-icon {
      display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;
      border-radius: 12px; background: var(--card); color: var(--accent-ink); box-shadow: var(--shadow-sm);
    }
    .tpl-category-name { font: 800 16px var(--font-display); color: var(--text) }
    .tpl-category-desc { font-size: 12px; color: var(--muted); line-height: 1.5 }
    @media (max-width: 520px) { .tpl-category-grid { grid-template-columns: 1fr } }

    .tpl-module { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-muted); overflow: hidden }
    .tpl-module-head-row { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px }
    .tpl-module-toggle { flex: 1 1 auto; display: flex; align-items: center; gap: 8px; min-width: 0; padding: 10px 8px; border: 0; background: transparent; color: var(--text); font: 700 13.5px inherit; text-align: left; cursor: pointer; border-radius: var(--radius-sm) }
    .tpl-module-toggle:hover, .tpl-module-toggle:focus-visible { background: var(--surface-muted); outline: none }
    .tpl-module-chevron { display: flex; flex: 0 0 auto; color: var(--muted); transition: transform .2s ease }
    .tpl-module-toggle[aria-expanded="true"] .tpl-module-chevron { transform: rotate(180deg) }
    .tpl-module-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

    /* Abertura/fechamento do dropdown — altura animada com valores medidos em pixel (ver
       openPanelFrom/closePanel em templates.js), não só CSS: o truque de grid-template-rows
       0fr→1fr parecia funcionar, mas a caixa de pré-visualização tem min-height próprio, que
       contamina o cálculo automático do CSS e o painel nunca chegava a 0 de verdade — sobrava um
       resto do formato fechado visível por baixo do próximo. .tpl-module-panel é só a casca que
       anima (por isso zero padding aqui: padding não-zero nunca deixa a altura chegar a 0 de
       verdade, mesmo com box-sizing:border-box) — o padding de verdade mora no
       .tpl-module-panel-inner, que pode ficar arbitrariamente alto por dentro sem afetar o
       colapso, porque overflow:hidden da casca corta tudo que sobra. */
    .tpl-module-panel { overflow: hidden; height: 0; transition: height .28s ease }
    .tpl-module-panel-inner { padding: 4px 16px 16px }
    @media (prefers-reduced-motion: reduce) { .tpl-module-panel { transition-duration: 1ms } }

    .tpl-spec-title { margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted) }
    .tpl-spec-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--text) }
    .tpl-practices { margin-top: 12px }
    .tpl-practices p { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--text) }

    /* Desktop e Mobile são a mesma peça, então aparecem juntos dentro do dropdown — cada versão
       tem seu próprio botão de copiar (ícone), que copia as informações pra colar num briefing.
       Cada versão vira um bloco de duas colunas: pré-visualização na proporção real à esquerda,
       tamanho mínimo/peso/arquivo/boas práticas daquela versão à direita. Grid com 1fr/1fr faz as
       duas colunas ocuparem toda a largura disponível em partes iguais; o stretch padrão do grid
       (align-items não sobrescrito) já iguala a altura das duas ao maior conteúdo das duas, sem
       precisar fixar um tamanho. A pré-visualização em si é um SVG com viewBox (ver shapeBoxSvg em
       templates.js) — ele encaixa sozinho dentro da coluna preservando a proporção real, do jeito
       que um <img> faria com object-fit:contain, então acompanha a coluna fluida sem JS. */
    .tpl-format-block { padding: 14px 0; border-top: 1px solid var(--border) }
    .tpl-module-panel-inner > .tpl-format-block:first-child { border-top: 0; padding-top: 0 }
    .tpl-format-block-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px }
    .tpl-copy-btn { width: 26px; height: 26px }
    .tpl-copy-btn.is-copied { color: var(--success); border-color: var(--success-border) }

    .tpl-format-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
    .tpl-format-preview, .tpl-format-info {
      box-sizing: border-box; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card);
    }
    .tpl-format-preview { display: flex; align-items: center; justify-content: center; padding: 16px; min-height: 120px }
    /* a largura vem inline (% relativa ao maior formato do grupo, ver shapeBoxSvg em
       templates.js) — a altura é automática, derivada do viewBox, então o retângulo nunca
       distorce; max-height é só uma proteção pra formatos retrato extremos não estourarem a
       coluna, algo que não acontece com os formatos cadastrados hoje (todos paisagem/quadrados) */
    .tpl-format-preview .tpl-shape-box { display: block; height: auto; max-height: 100%; overflow: visible }
    .tpl-format-preview .tpl-shape-box rect { fill: var(--surface-muted); stroke: var(--border-strong); stroke-width: 3 }
    /* Faixa de degradê automático (gradientHeight em shapeBoxSvg/templates.js) — sombreada e
       rente à borda de baixo, desenhada ANTES das margens de segurança (fica atrás delas) */
    .tpl-format-preview .tpl-shape-box .tpl-gradient-zone { fill: var(--text-faint); opacity: .25; stroke: var(--border-strong); stroke-width: 2; stroke-dasharray: 6 5 }
    /* Margens de segurança (safeAreas em shapeBoxSvg/templates.js) — retângulo tracejado sem
       preenchimento por cima do retângulo externo, pra não competir com ele visualmente */
    .tpl-format-preview .tpl-shape-box .tpl-safe-area-rect { fill: none; stroke: var(--accent-ink); stroke-width: 2.5; stroke-dasharray: 10 8; opacity: .65 }
    .tpl-format-info { padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px }
    .tpl-format-info .tpl-practices { margin-top: 0 }
    @media (max-width: 560px) { .tpl-format-grid { grid-template-columns: 1fr } .tpl-format-preview { min-height: 160px } }

    .tpl-edit-form { display: flex; flex-direction: column }
    .tpl-edit-form .form-group { margin-bottom: 10px }
    .tpl-edit-form label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 8px }
    .tpl-edit-form label:last-child { margin-bottom: 0 }
    .tpl-edit-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px }
  </style>
</head>

<body>
  <div class="portal-shell">
    <!-- Menu do portal (navegação entre ferramentas + seletor de marca), montado por portal-shell.js -->
    <aside class="portal-sidebar" id="portalSidebar"></aside>
    <div class="portal-main">
      <div class="container">

        <div class="page-header">
          <div>
            <h1>Templates</h1>
            <p class="page-subtitle">Referência de formatos por marketplace: medidas, peso máximo e boas práticas de
              cada peça.</p>
          </div>
        </div>

        <div class="card">
          <h3 class="fg-label" style="margin:0 0 12px">Institucionais</h3>
          <div class="tpl-gallery-row" id="tplInstGalleryRow"></div>
          <div class="bg-empty" id="tplInstGalleryEmpty" style="display:none"></div>
        </div>

        <div class="card" style="margin-top:16px">
          <h3 class="fg-label" style="margin:0 0 12px">Marketplaces</h3>
          <div class="tpl-gallery-row" id="tplGalleryRow"></div>
          <div class="bg-empty" id="tplGalleryEmpty" style="display:none"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal de formatos — um único modal reaproveitado para qualquer marketplace clicado -->
  <div class="modal-backdrop" id="tplModalBackdrop" aria-hidden="true">
    <section class="modal modal--wide tpl-modal" id="tplModal" role="dialog" aria-modal="true"
      aria-labelledby="tplModalTitle">
      <div class="modal-header" id="tplModalHeader">
        <div class="modal-header-title">
          <button type="button" id="tplBackBtn" class="modal-back-btn" style="display:none" aria-label="Voltar às áreas"
            title="Voltar às áreas">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6" />
            </svg><span>Voltar</span>
          </button>
          <span class="tpl-modal-logo" id="tplModalLogo" aria-hidden="true"></span>
          <h2 id="tplModalTitle"></h2>
        </div>
        <div class="modal-header-actions">
          <button type="button" class="modal-close" id="tplAddModuleBtn" style="display:none" title="Adicionar novo formato"
            aria-label="Adicionar novo formato">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
          </button>
          <button type="button" class="modal-close" id="tplModalClose" aria-label="Fechar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
      </div>
      <div class="modal-body">
        <!-- Antes de escolher um formato, o usuário escolhe a área do marketplace (Loja Oficial
             ou Ads) — os formatos e medidas mudam conforme a área, ver CATEGORIES em templates.js -->
        <div id="tplCategoryView">
          <div class="tpl-category-grid" id="tplCategoryGrid"></div>
        </div>
        <div id="tplFormatsView" style="display:none">
          <div class="tpl-modal-modules" id="tplModuleList"></div>
        </div>
      </div>
    </section>
  </div>

  <!-- Editar card (nome + foto de fundo) — só admin, aberto pelo menu de reticências do card
       (ver openChannelEditModal em templates.js). Reaproveita .modal-backdrop/.modal/.modal-sm. -->
  <div class="modal-backdrop" id="tplChannelEditBackdrop" aria-hidden="true">
    <section class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="tplChannelEditTitle">
      <div class="modal-header">
        <div class="modal-header-title"><h2 id="tplChannelEditTitle">Editar</h2></div>
        <div class="modal-header-actions">
          <button type="button" class="modal-close" id="tplChannelEditClose" aria-label="Fechar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
      </div>
      <form id="tplChannelEditForm">
        <div class="modal-body">
          <label class="tpl-channel-photo-picker" title="Clique para alterar a foto">
            <span class="tpl-channel-photo-picker-media" id="tplChannelEditPhotoPreview"></span>
            <input type="file" accept="image/*" id="tplChannelEditPhotoInput" style="display:none" />
            <span class="tpl-channel-photo-picker-hint">Alterar foto</span>
          </label>
          <div class="form-group" style="background:transparent;border:0;padding:0;margin:0">
            <label>Nome<input type="text" id="tplChannelEditName" required /></label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn ghost" id="tplChannelEditCancel">Cancelar</button>
          <button type="submit" class="btn">Salvar</button>
        </div>
      </form>
    </section>
  </div>

  <!-- Confirmação de duplicar/excluir card — só admin, mesmo padrão do #cardActionConfirmBackdrop
       em visual-editor.html (título/mensagem trocados por JS conforme a ação, ver
       openChannelConfirm em templates.js). -->
  <div class="modal-backdrop" id="tplChannelConfirmBackdrop" aria-hidden="true">
    <section class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="tplChannelConfirmTitle">
      <div class="modal-header">
        <div class="modal-header-title"><h2 id="tplChannelConfirmTitle">Confirmar ação</h2></div>
        <div class="modal-header-actions">
          <button type="button" class="modal-close" id="tplChannelConfirmClose" aria-label="Fechar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
      </div>
      <div class="modal-body">
        <p id="tplChannelConfirmMessage" style="margin:0;font-size:13px;line-height:1.55;color:var(--text)"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn ghost" id="tplChannelConfirmCancel">Cancelar</button>
        <button type="button" class="btn" id="tplChannelConfirmOk">Confirmar</button>
      </div>
    </section>
  </div>

  <script src="sync-backend.js"></script>
  <script src="portal-shell.js"></script>
  <script src="templates.js"></script>
</body>

</html>
