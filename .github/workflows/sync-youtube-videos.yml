name: Sincronizar vídeos do YouTube

# Mesmo espírito de sync-meta-posts.yml (Instagram), mas para os vídeos do canal Vonder —
# alimenta o mesmo painel "Melhores posts" do followers-dashboard.js, agora também para o
# YouTube. Usa só a YOUTUBE_API_KEY já existente (dados públicos, sem OAuth): não tem
# endpoint único "listar meus vídeos com estatísticas", então são 3 chamadas em sequência —
# achar a playlist de uploads do canal, listar os vídeos dela (paginando até 150, porque o
# canal publica Shorts quase todo dia e só os uploads mais recentes ficavam só de Shorts) e
# pedir estatísticas em lote.
#
# Shorts vs vídeo normal: a duração sozinha não é confiável (um vídeo "normal" também pode
# durar menos de 3 min) — a API do YouTube não expõe nenhum campo "isto é um Short". O sinal
# real usado aqui é o próprio roteamento do youtube.com: abrir youtube.com/shorts/ID SEM
# redirecionar para /watch?v=ID só acontece quando o vídeo é mesmo um Short — é como o site
# oficial decide o que mostrar como Short, então é mais confiável que qualquer heurística
# nossa. Isso custa uma requisição HTTP por vídeo (fora da API do YouTube, sem custo de quota),
# então o resultado é cacheado por vídeo entre execuções — só verifica de novo vídeos novos,
# nunca os que já apareceram numa coleta anterior.

on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Coletar vídeos e métricas
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: 'UCflcAVLpPmH-03R-njMSayw'
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_API_KEY"
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          api_key = os.environ['YOUTUBE_API_KEY']
          channel_id = os.environ['YOUTUBE_CHANNEL_ID']
          base = 'https://www.googleapis.com/youtube/v3'

          def get(path, **params):
              params['key'] = api_key
              url = f'{base}/{path}?{urllib.parse.urlencode(params)}'
              with urllib.request.urlopen(url, timeout=30) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          # A API do YouTube não tem "listar meus vídeos com estatísticas" direto — o caminho é
          # achar a playlist especial de uploads do canal e listar os itens dela.
          canal = get('channels', part='contentDetails', id=channel_id)
          items = canal.get('items') or []
          if not items:
              raise SystemExit('A API do YouTube não retornou o canal — não grava nada para não apagar o snapshot anterior.')
          uploads_playlist = items[0]['contentDetails']['relatedPlaylists']['uploads']

          # O canal publica Shorts quase todo dia — só os 30 uploads mais recentes ficavam só
          # de Shorts, empurrando os vídeos "normais" mais espaçados para fora da janela. Pagina
          # até 150 itens (5 páginas de 30) para os dois tipos terem chance de aparecer.
          entries = []
          page_token = None
          while len(entries) < 150:
              playlist = get('playlistItems', part='snippet', playlistId=uploads_playlist,
                              maxResults=30, **({'pageToken': page_token} if page_token else {}))
              entries += playlist.get('items') or []
              page_token = playlist.get('nextPageToken')
              if not page_token:
                  break
          if not entries:
              raise SystemExit('A playlist de uploads não retornou nenhum vídeo — não grava nada para não apagar o snapshot anterior.')

          video_ids = [entry['snippet']['resourceId']['videoId'] for entry in entries]
          # videos.list aceita até 50 ids por chamada — pagina em lotes.
          stats_by_id = {}
          for i in range(0, len(video_ids), 50):
              lote = video_ids[i:i + 50]
              resposta = get('videos', part='statistics', id=','.join(lote))
              for item in resposta.get('items', []):
                  stats_by_id[item['id']] = item.get('statistics', {})

          # Cache: reaproveita a classificação Short/vídeo de uma coleta anterior — só videos
          # novos (nunca vistos) pagam o custo de uma requisição a mais.
          anterior_path = Path('data/social-youtube-videos.json')
          tipo_conhecido = {}
          if anterior_path.exists():
              anterior = json.loads(anterior_path.read_text(encoding='utf-8'))
              for post in anterior.get('posts', []):
                  if post.get('id') and post.get('mediaProductType'):
                      tipo_conhecido[post['id']] = post['mediaProductType']

          def eh_short(video_id):
              # youtube.com/shorts/ID só NÃO redireciona para /watch?v=ID quando o vídeo é
              # mesmo um Short — é o próprio site oficial decidindo, não uma estimativa nossa.
              url = f'https://www.youtube.com/shorts/{video_id}'
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'}, method='HEAD')
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      return '/shorts/' in resp.geturl()
              except Exception:
                  return None  # rede falhou — trata como "não sabemos" no chamador

          videos = []
          falhas_classificacao = 0
          for entry in entries:
              snippet = entry['snippet']
              video_id = snippet['resourceId']['videoId']
              stats = stats_by_id.get(video_id, {})
              thumbnails = snippet.get('thumbnails') or {}
              thumb = (thumbnails.get('medium') or thumbnails.get('default') or {}).get('url')

              media_product_type = tipo_conhecido.get(video_id)
              if media_product_type is None:
                  resultado = eh_short(video_id)
                  if resultado is None:
                      falhas_classificacao += 1  # fica sem a chave abaixo — próxima rodada tenta de novo
                  else:
                      media_product_type = 'REELS' if resultado else 'VIDEO'

              video = {
                  'id': video_id,
                  'network': 'YouTube',
                  'caption': snippet.get('title') or '',
                  'permalink': f'https://www.youtube.com/watch?v={video_id}',
                  'thumbnailUrl': thumb,
                  'timestamp': snippet.get('publishedAt'),
                  'likeCount': int(stats.get('likeCount', 0) or 0),
                  'views': int(stats.get('viewCount', 0) or 0),
              }
              # Sem chave (em vez de um valor "chutado") quando a classificação falhou — o
              # painel trata chave ausente como "—", igual às demais métricas que faltam, e a
              # próxima execução tenta classificar de novo (ver tipo_conhecido acima).
              if media_product_type is not None:
                  # Mesmo nome/valor que sync-meta-posts.yml usa para Reels — o painel já separa
                  # "Reels vs Estático" por essa chave, sem precisar de nenhuma mudança no JS.
                  video['mediaProductType'] = media_product_type
              # commentCount some quando os comentários do vídeo estão desativados — omite a
              # chave (em vez de gravar "0", que pareceria zero comentários de verdade); o
              # painel já trata chave ausente como "—", igual às demais métricas que faltam.
              if 'commentCount' in stats:
                  video['commentsCount'] = int(stats['commentCount'])
              videos.append(video)

          document = {
              'version': 1,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'posts': videos,
          }
          Path('data/social-youtube-videos.json').write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Coletados {len(videos)} vídeos ({falhas_classificacao} sem classificar Short/vídeo por falha de rede — tenta de novo na próxima).')
          PY

      - name: Publicar dados atualizados
        run: |
          git add data/social-youtube-videos.json
          if git diff --cached --quiet -- data/social-youtube-videos.json; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: atualizar vídeos do YouTube'
          for tentativa in 1 2 3; do
            if git push; then break; fi
            echo "Push rejeitado (tentativa $tentativa/3), atualizando e tentando de novo..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            [ "$tentativa" -eq 3 ] && exit 1
          done

      # Documento próprio (youtube-videos-vonder-v1), separado de posts-vonder-v1 (Instagram) —
      # o painel lê os dois e junta, mas cada coleta escreve só o seu, sem risco de uma apagar
      # o snapshot da outra.
      - name: Publicar vídeos no Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo '::warning::FIREBASE_SERVICE_ACCOUNT_KEY não configurado — pulando a gravação em portalStore/youtube-videos-vonder-v1.'
            exit 0
          fi
          pip install --quiet firebase-admin
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          import firebase_admin
          from firebase_admin import credentials, firestore

          cred = credentials.Certificate(json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_KEY']))
          firebase_admin.initialize_app(cred)
          db = firestore.client()

          published = json.loads(Path('data/social-youtube-videos.json').read_text(encoding='utf-8'))

          db.collection('portalStore').document('youtube-videos-vonder-v1').set({
              'v': published,
              'updated_at': int(time.time() * 1000),
              'updatedAt': firestore.SERVER_TIMESTAMP,
          })
          print('Firestore atualizado:', len(published['posts']), 'vídeos em', published['updatedAt'])
          PY
