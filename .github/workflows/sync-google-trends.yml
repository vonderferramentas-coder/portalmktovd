name: Sincronizar tendências do Google

# Coleta diária do Google Trends (painel "Central de Inteligência") via pytrends — biblioteca
# não-oficial que espelha o site do Trends (o Google não tem API oficial). Para cada uma das 7
# categorias monitoradas, consulta a "Central de Inteligência" no site do Google Trends sem
# informar um termo de busca (kw_list=['']), só a categoria — é o mesmo request que o site faz
# quando a pessoa explora só por categoria, sem digitar nada na busca — e usa o retorno de
# related_queries() como ranking de termos da categoria (top = interesse; rising = variação).
# Depois de coletar, scripts/match_trends_catalog.py cruza cada termo com data/catalog-vonder.json
# (ver docs/ARQUITETURA-E-INTEGRACOES.md, seção 16) e anota matchedProducts em cada termo, antes
# de publicar — o cruzamento roda uma vez por dia aqui, nunca no navegador (catálogo tem 12 MB).

on:
  # Sem cron próprio: disparado só pelo Worker do Cloudflare (cloudflare-agendador.js, horário em
  # UTC). O cron do GitHub atrasa horas e, ao chegar tarde, cancelava runs na fila (ARQUITETURA, seção 23).
  workflow_dispatch:

permissions:
  contents: write

# Mesmo grupo compartilhado por todos os workflows deste projeto que fazem git push — evita
# colidir no mesmo commit com as demais coletas (ver docs/ARQUITETURA-E-INTEGRACOES.md, seção 8).
concurrency:
  group: portal-dados-git-push
  cancel-in-progress: false

jobs:
  sync-google-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Coletar tendências por categoria
        run: |
          pip install --quiet pytrends
          python3 - <<'PY'
          import json, time
          from datetime import datetime, timezone
          from pathlib import Path

          from pytrends.request import TrendReq

          GEO = 'BR'
          CATEGORIES = [
              ('construction-power-tools', 'Construction & Power Tools', 950),
              ('home-improvement', 'Home Improvement', 158),
              ('yard-patio', 'Yard & Patio', 953),
              ('construction-maintenance', 'Construction & Maintenance', 48),
              # No Google Trends o nome oficial desta categoria é "Autos & Vehicles"
              # (id 47) — mantido como "Automotive" aqui por ser o nome pedido pro filtro.
              ('automotive', 'Automotive', 47),
              ('cleaning-supplies-services', 'Cleaning Supplies & Services', 949),
              # Nome oficial no Google Trends: "Industrial Materials & Equipment" (id 287).
              ('industrial-materials', 'Industrial Materials', 287),
          ]
          # "Comparativo anual" (filtro do front-end) reaproveita o balde 12m — o pytrends não
          # devolve duas séries (ano atual x anterior) sem uma lista de termos fixa pra comparar,
          # e o "rising" de uma janela de 12 meses já reflete o crescimento vs. o período anterior.
          TIMEFRAMES = [
              ('7d', 'now 7-d'),
              ('30d', 'today 1-m'),
              ('90d', 'today 3-m'),
              ('12m', 'today 12-m'),
          ]

          def format_variation(value):
              if value is None:
                  return None
              try:
                  return f'+{round(float(value))}%'
              except (TypeError, ValueError):
                  # pytrends pode devolver "Breakout" (string) em vez de número quando o
                  # crescimento parte de uma base próxima de zero.
                  return 'Alta'

          def fetch_related(cat_id, timeframe, attempts=3):
              last_error = None
              for attempt in range(1, attempts + 1):
                  try:
                      pytrends = TrendReq(hl='pt-BR', tz=180, timeout=(5, 25))
                      pytrends.build_payload(kw_list=[''], cat=cat_id, timeframe=timeframe, geo=GEO)
                      return pytrends.related_queries().get('', {})
                  except Exception as error:  # noqa: BLE001 — qualquer falha de rede/rate-limit do Google
                      last_error = error
                      print(f'  tentativa {attempt}/{attempts} falhou: {type(error).__name__}: {error}')
                      time.sleep(8 * attempt)
              print(f'  desistindo após {attempts} tentativas: {last_error}')
              return None

          path = Path('data/google-trends.json')
          document = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {
              'version': 1, 'geo': GEO, 'updatedAt': None, 'categories': {}
          }
          categories = dict(document.get('categories') or {})
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          for slug, label, cat_id in CATEGORIES:
              bucket = dict(categories.get(slug) or {'label': label, 'periods': {}})
              bucket['label'] = label
              bucket['periods'] = dict(bucket.get('periods') or {})
              categories[slug] = bucket

          # As 28 combinações (categoria x janela) rodam numa ordem que gira um passo por dia: quando o Google passa a
          # limitar a taxa no meio da coleta, a falha não cai sempre nas mesmas (antes, as últimas categorias ficavam dias
          # sem atualizar).
          jobs = [(slug, label, cat_id, period_key, timeframe)
                  for slug, label, cat_id in CATEGORIES for period_key, timeframe in TIMEFRAMES]
          shift = datetime.now(timezone.utc).toordinal() % len(jobs)
          jobs = jobs[shift:] + jobs[:shift]

          def collect(job):
              slug, label, cat_id, period_key, timeframe = job
              print(f'{label} / {period_key} ({timeframe})...')
              result = fetch_related(cat_id, timeframe)
              top = None if result is None else result.get('top')
              if top is None or top.empty:
                  print('  sem dado novo.')
                  return False
              rising = result.get('rising')
              rising_lookup = {}
              if rising is not None and not rising.empty:
                  for _, row in rising.iterrows():
                      rising_lookup[str(row['query']).strip().lower()] = row['value']
              # Posição anterior de cada termo, para a coluna "Variação" (subiu/desceu/novo). A base é a coleta anterior
              # DE OUTRO DIA; se o workflow rodar de novo no mesmo dia, mantém a comparação já gravada em vez de
              # comparar o dia com ele mesmo.
              old = categories[slug]['periods'].get(period_key) or {}
              old_terms = old.get('terms') or []
              same_day = str(old.get('collectedAt') or '')[:10] == today
              carried = {}
              old_rank = {}
              if same_day:
                  carried = {str(t.get('term', '')).strip().lower(): t for t in old_terms}
                  previous_collected = old.get('previousCollectedAt')
              else:
                  old_rank = {str(t.get('term', '')).strip().lower(): t.get('rank') for t in old_terms}
                  previous_collected = old.get('collectedAt') if old_terms else None
              terms = []
              for rank, (_, row) in enumerate(top.iterrows(), start=1):
                  term = str(row['query']).strip()
                  entry = {
                      'rank': rank,
                      'term': term,
                      'interest': int(row['value']),
                      'variation': format_variation(rising_lookup.get(term.lower())),
                  }
                  key = term.lower()
                  if same_day:
                      before = carried.get(key) or {}
                      if before.get('previousRank') is not None:
                          entry['previousRank'] = before['previousRank']
                      if before.get('isNew'):
                          entry['isNew'] = True
                  elif old_terms:
                      if old_rank.get(key) is not None:
                          entry['previousRank'] = old_rank[key]
                      else:
                          entry['isNew'] = True
                  terms.append(entry)
              categories[slug]['periods'][period_key] = {
                  'collectedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
                  'previousCollectedAt': previous_collected,
                  'terms': terms,
              }
              return True

          # Combinação sem dado novo é refeita em até 2 rodadas extras (com pausa para o limite do Google baixar) antes de
          # desistir; se ainda falhar, o painel mantém o último dado bom e avisa que ele está velho (ver intelligence-center.js).
          any_success = False
          pending = jobs
          for round_number in range(1, 4):
              failed = []
              for job in pending:
                  if collect(job):
                      any_success = True
                  else:
                      failed.append(job)
                  time.sleep(5)
              pending = failed
              if not pending:
                  break
              if round_number < 3:
                  print(f'{len(pending)} combinações sem dado novo - pausa de 90s e nova rodada ({round_number + 1}/3)...')
                  time.sleep(90)
          if pending:
              print(f"::warning::{len(pending)} combinações ficaram com o dado anterior: " + ', '.join(f'{j[0]}/{j[3]}' for j in pending))

          if any_success:
              document['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          document['version'] = 1
          document['geo'] = GEO
          document['categories'] = categories
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Nenhuma categoria coletada com sucesso nesta execução.' if not any_success else 'Coleta concluída.')
          PY

      - name: Cruzar termos com o catálogo de produtos
        run: python3 scripts/match_trends_catalog.py

      - name: Publicar dados atualizados
        run: |
          git add data/google-trends.json
          if git diff --cached --quiet -- data/google-trends.json; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: atualizar snapshot Google Trends'
          for tentativa in 1 2 3; do
            if git push; then break; fi
            echo "Push rejeitado (tentativa $tentativa/3), atualizando e tentando de novo..."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then git rebase --abort; fi
            [ "$tentativa" -eq 3 ] && exit 1
          done

      # Mesmo mecanismo dos demais workflows de coleta: grava o snapshot direto em
      # portalStore/trends-v1 via Admin SDK, reaproveitando o secret FIREBASE_SERVICE_ACCOUNT_KEY
      # já cadastrado — a Central de Inteligência lê só o Firestore, nunca o arquivo estático.
      - name: Publicar snapshot no Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo '::warning::FIREBASE_SERVICE_ACCOUNT_KEY não configurado — pulando a gravação em portalStore/trends-v1.'
            exit 0
          fi
          pip install --quiet firebase-admin
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          import firebase_admin
          from firebase_admin import credentials, firestore

          cred = credentials.Certificate(json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_KEY']))
          firebase_admin.initialize_app(cred)
          db = firestore.client()

          snapshot = json.loads(Path('data/google-trends.json').read_text(encoding='utf-8'))
          db.collection('portalStore').document('trends-v1').set({
              'v': snapshot,
              'updated_at': int(time.time() * 1000),
              'updatedAt': firestore.SERVER_TIMESTAMP,
          })
          print('Firestore atualizado:', snapshot.get('updatedAt'))
          PY
