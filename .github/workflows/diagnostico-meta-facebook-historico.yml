name: Diagnóstico de histórico do Facebook na API Meta

# Sonda quais métricas de Insights da Página do Facebook ainda respondem (várias métricas de
# "fãs"/seguidores foram descontinuadas pela Meta ao longo dos anos) — passo necessário antes
# de escrever uma reconstrução de histórico como a de reconstruir-historico.yml (que usa uma
# métrica exclusiva do Instagram, não aplicável aqui). Não grava nada e não faz commit — só
# escreve no resumo da execução. O token vai no cabeçalho Authorization, e não na URL, para
# não aparecer em log de erro do curl (mesmo padrão dos demais diagnósticos).

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar métricas de histórico da Página
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID: '262406600508752'
        run: |
          set -uo pipefail
          API="https://graph.facebook.com/v26.0"
          SINCE="$(date -u -d '29 days ago' +%s)"
          UNTIL="$(date -u -d 'yesterday' +%s)"

          consultar () {
            titulo="$1"
            url="$2"
            {
              echo "### $titulo"
              echo ''
              echo '```json'
            } >> "$GITHUB_STEP_SUMMARY"
            if resposta="$(curl -sS --max-time 30 -H "Authorization: Bearer $META_PAGE_ACCESS_TOKEN" "$url")"; then
              printf '%s\n' "$resposta" | jq '.' 2>/dev/null | head -c 3000 >> "$GITHUB_STEP_SUMMARY" \
                || printf '%s\n' "$resposta" | head -c 3000 >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'A chamada falhou antes de receber resposta.' >> "$GITHUB_STEP_SUMMARY"
            fi
            {
              echo ''
              echo '```'
              echo ''
            } >> "$GITHUB_STEP_SUMMARY"
          }

          echo "## Quais permissões o token tem hoje" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"

          consultar "debug_token — escopos (scopes) concedidos ao token atual" \
            "$API/debug_token?input_token=$META_PAGE_ACCESS_TOKEN&access_token=$META_PAGE_ACCESS_TOKEN"

          {
            echo "Se \`read_insights\` NÃO aparecer na lista de \`scopes\` acima, é só isso: o token"
            echo "foi gerado sem pedir essa permissão — dá para gerar um novo token pedindo"
            echo "\`read_insights\` (sem precisar de revisão de app da Meta, contanto que quem gerar"
            echo "seja administrador da Página). Se \`read_insights\` já estiver na lista mesmo assim,"
            echo "aí sim as métricas abaixo estão mesmo descontinuadas/vazias para esta Página."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "## page_follows — até onde a Meta deixa puxar de uma vez" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "page_follows já confirmado como total acumulado por dia, com read_insights concedido." >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"

          SINCE_AMPLO="$(date -u -d '3 years ago' +%s)"

          consultar "Janela ampla: 3 anos até ontem — conta quantos pontos volta e mostra paging" \
            "$API/$META_FACEBOOK_PAGE_ID/insights?metric=page_follows&period=day&since=$SINCE_AMPLO&until=$UNTIL"

          echo '### Quantidade de dias retornados na janela ampla' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          resposta_ampla="$(curl -sS --max-time 30 -H "Authorization: Bearer $META_PAGE_ACCESS_TOKEN" \
            "$API/$META_FACEBOOK_PAGE_ID/insights?metric=page_follows&period=day&since=$SINCE_AMPLO&until=$UNTIL")"
          qtd="$(printf '%s' "$resposta_ampla" | jq -r '.data[0].values | length' 2>/dev/null || echo '?')"
          primeiro="$(printf '%s' "$resposta_ampla" | jq -r '.data[0].values[0].end_time' 2>/dev/null || echo '?')"
          ultimo="$(printf '%s' "$resposta_ampla" | jq -r '.data[0].values[-1].end_time' 2>/dev/null || echo '?')"
          tem_previous="$(printf '%s' "$resposta_ampla" | jq -r 'if .paging.previous then "sim" else "nao" end' 2>/dev/null || echo '?')"
          {
            echo "- Pontos retornados: **$qtd**"
            echo "- Do dia **$primeiro** até **$ultimo**"
            echo "- Existe página anterior (\`paging.previous\`) pra buscar dias ainda mais antigos: **$tem_previous**"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo ''
            echo "Se \`paging.previous\` existir, a reconstrução final precisa paginar pra trás em"
            echo "vez de confiar num único since/until. Se a quantidade de pontos for bem menor"
            echo "que os dias entre since e until, a Meta está limitando a janela por chamada —"
            echo "nesse caso a reconstrução também precisa paginar/repetir a consulta em pedaços."
          } >> "$GITHUB_STEP_SUMMARY"
