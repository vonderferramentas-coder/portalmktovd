name: Diagnóstico de histórico do Facebook na API Meta

# Sonda quais métricas de Insights da Página do Facebook ainda respondem (várias métricas de
# "fãs"/seguidores foram descontinuadas pela Meta ao longo dos anos) — passo necessário antes
# de escrever uma reconstrução de histórico como a de reconstruir-historico.yml (que usa uma
# métrica exclusiva do Instagram, não aplicável aqui). Não grava nada e não faz commit — só
# escreve no resumo da execução. O token vai no cabeçalho Authorization, e não na URL, para
# não aparecer em log de erro do curl (mesmo padrão dos demais diagnósticos).

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar métricas de histórico da Página
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID: '262406600508752'
        run: |
          set -uo pipefail
          API="https://graph.facebook.com/v26.0"
          SINCE="$(date -u -d '29 days ago' +%s)"
          UNTIL="$(date -u -d 'yesterday' +%s)"

          consultar () {
            titulo="$1"
            url="$2"
            {
              echo "### $titulo"
              echo ''
              echo '```json'
            } >> "$GITHUB_STEP_SUMMARY"
            if resposta="$(curl -sS --max-time 30 -H "Authorization: Bearer $META_PAGE_ACCESS_TOKEN" "$url")"; then
              printf '%s\n' "$resposta" | jq '.' 2>/dev/null | head -c 3000 >> "$GITHUB_STEP_SUMMARY" \
                || printf '%s\n' "$resposta" | head -c 3000 >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'A chamada falhou antes de receber resposta.' >> "$GITHUB_STEP_SUMMARY"
            fi
            {
              echo ''
              echo '```'
              echo ''
            } >> "$GITHUB_STEP_SUMMARY"
          }

          echo "## Quais permissões o token tem hoje" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"

          consultar "debug_token — escopos (scopes) concedidos ao token atual" \
            "$API/debug_token?input_token=$META_PAGE_ACCESS_TOKEN&access_token=$META_PAGE_ACCESS_TOKEN"

          {
            echo "Se \`read_insights\` NÃO aparecer na lista de \`scopes\` acima, é só isso: o token"
            echo "foi gerado sem pedir essa permissão — dá para gerar um novo token pedindo"
            echo "\`read_insights\` (sem precisar de revisão de app da Meta, contanto que quem gerar"
            echo "seja administrador da Página). Se \`read_insights\` já estiver na lista mesmo assim,"
            echo "aí sim as métricas abaixo estão mesmo descontinuadas/vazias para esta Página."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "## Quais métricas de histórico de seguidores/fãs a Página ainda expõe" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Janela consultada: 29 dias até ontem." >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"

          consultar "page_fans — total acumulado de curtidas por dia (métrica clássica, pode estar descontinuada)" \
            "$API/$META_FACEBOOK_PAGE_ID/insights?metric=page_fans&period=day&since=$SINCE&until=$UNTIL"

          consultar "page_follows — total acumulado de seguidores por dia" \
            "$API/$META_FACEBOOK_PAGE_ID/insights?metric=page_follows&period=day&since=$SINCE&until=$UNTIL"

          consultar "page_fan_adds_unique — entradas únicas por dia (métrica antiga)" \
            "$API/$META_FACEBOOK_PAGE_ID/insights?metric=page_fan_adds_unique&period=day&since=$SINCE&until=$UNTIL"

          consultar "page_fan_removes_unique — saídas únicas por dia (métrica antiga)" \
            "$API/$META_FACEBOOK_PAGE_ID/insights?metric=page_fan_removes_unique&period=day&since=$SINCE&until=$UNTIL"

          consultar "page_daily_follows_unique — entradas únicas por dia (métrica atual)" \
            "$API/$META_FACEBOOK_PAGE_ID/insights?metric=page_daily_follows_unique&period=day&since=$SINCE&until=$UNTIL"

          consultar "page_daily_unfollows_unique — saídas únicas por dia (métrica atual)" \
            "$API/$META_FACEBOOK_PAGE_ID/insights?metric=page_daily_unfollows_unique&period=day&since=$SINCE&until=$UNTIL"

          consultar "Lista de todas as métricas de insights que a Página expõe hoje (catálogo completo)" \
            "$API/$META_FACEBOOK_PAGE_ID/insights?metric=page_fans,page_follows,page_daily_follows_unique,page_daily_unfollows_unique&period=day&since=$SINCE&until=$UNTIL"

          {
            echo "Se alguma consulta trouxer \`data\` com valores (em vez de erro de permissão ou"
            echo "'(#100) metric ... is deprecated'), dá para reconstruir o histórico do Facebook"
            echo "como já é feito para o Instagram. Se todas vierem descontinuadas, o histórico do"
            echo "Facebook só poderá começar a partir de hoje, sem reconstrução retroativa —"
            echo "a Meta não guarda esse dado de outra forma consultável."
          } >> "$GITHUB_STEP_SUMMARY"
