name: Sincronizar seguidores TikTok

# A TikTok rejeitou o App Review do Login Kit em 17/09/2026 (uso interno não é permitido em
# nenhum produto de developers.tiktok.com — ver docs/ARQUITETURA-E-INTEGRACOES.md seção 15 e
# docs/pesquisa-tiktok-business-api.md). Sem API oficial viável, este workflow lê o número de
# seguidores já público na página de perfil da Social Blade (socialblade.com/tiktok/user/...),
# confirmado manualmente em 17/09/2026: HTTP 200 sem barreira anti-bot, `robots.txt` não
# bloqueia a página, valor exato (não arredondado) para o porte da conta — ver
# docs/pesquisa-tiktok-scraping-seguidores.md para o teste completo e a ressalva de ToS
# (scraping de HTML fora do canal "oficial" que a própria Social Blade documenta, que é a
# Business API paga por crédito). Só a VONDER tem TikTok — Ferramentas Gerais não usa essa rede.
#
# ponytail: isso lê a página pública de terceiro (Social Blade), não uma API oficial deles —
# some sozinho se a estrutura da página mudar. Evolução: trocar pela Social Blade Business API
# (matrix.sbapis.com/b/tiktok/statistics, cobrada por crédito) se o preço se justificar, ou
# voltar para lançamento manual (publicar-tiktok-manual.yml) se este scraping parar de
# funcionar e não compensar consertar.
on:
  schedule:
    # Fechamento diário às 23:55 de São Paulo (02:55 UTC) — mesmo horário do fechamento do
    # Instagram/Facebook (sync-meta-followers.yml), mas em workflow separado: aqui não há
    # cron de rotina de 15 em 15 min pra colidir (só 1 disparo por dia), então não se aplica o
    # mesmo risco de colisão de agendamento que forçou a janela de horário real lá.
    - cron: '55 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Mesmo grupo de concorrência dos demais workflows que fazem git push nos arquivos de dados —
# evita dois workflows colidindo no mesmo commit (ver sync-meta-followers.yml).
concurrency:
  group: portal-dados-git-push
  cancel-in-progress: false

jobs:
  sync-tiktok:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Consultar seguidores do TikTok na Social Blade
        id: socialblade
        env:
          TIKTOK_USERNAME: vonderferramentas
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            "https://socialblade.com/tiktok/user/$TIKTOK_USERNAME" \
            --output socialblade-response.html
          # O HTML embute o número de seguidores como string (ex.: "followers":"4243") dentro
          # do bloco de hidratação do Next.js (__NEXT_DATA__) — extrai a primeira ocorrência.
          # Se a Social Blade mudar a estrutura da página, este grep para de casar e falha
          # aqui (--fail-like via `test -n`), em vez de gravar um valor errado silenciosamente.
          followers="$(grep -o '"followers":"[0-9]\+"' socialblade-response.html | head -1 | grep -o '[0-9]\+')"
          test -n "$followers"
          echo "followers=$followers" >> "$GITHUB_OUTPUT"

      - name: Atualizar snapshot público
        env:
          FOLLOWERS: ${{ steps.socialblade.outputs.followers }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          # Mescla só a chave TikTok em 'platforms' — sync-meta-followers.yml/
          # sync-youtube-followers.yml gravam Instagram/Facebook/YouTube no mesmo arquivo.
          path = Path('data/social-followers-live.json')
          document = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'version': 2, 'platforms': {}}
          platforms = dict(document.get('platforms') or {})
          platforms['TikTok'] = {
              'username': 'vonderferramentas',
              'followers': int(os.environ['FOLLOWERS']),
              'source': 'social_blade_scrape'
          }
          document.update({
              'version': 2,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'platforms': platforms
          })
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Fechar histórico diário
        env:
          FOLLOWERS: ${{ steps.socialblade.outputs.followers }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path('data/social-followers.json')
          document = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'version': 2, 'history': []}
          # A execução ocorre às 02:55 UTC, equivalente a 23:55 em São Paulo — mesma fórmula
          # de sync-meta-followers.yml, pra fechar o mesmo dia de calendário que Instagram/
          # Facebook/YouTube.
          closing_date = (datetime.now(timezone.utc) - timedelta(hours=3)).date().isoformat()
          history = {item['date']: item for item in document.get('history', []) if item.get('date')}
          # Mescla só TikTok no dia: preserva Instagram/Facebook/YouTube que outro workflow já
          # tenha fechado no mesmo dia — um `history.append` substituindo o dia inteiro os apagaria.
          existing_day = dict(history.get(closing_date) or {'date': closing_date})
          existing_day['followers'] = dict(existing_day.get('followers') or {})
          existing_day['followers']['TikTok'] = int(os.environ['FOLLOWERS'])
          history[closing_date] = existing_day
          history = [history[day] for day in sorted(history)]
          document.update({
              'version': 2,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'history': history
          })
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar dados atualizados
        run: |
          git add data/social-followers.json data/social-followers-live.json
          if git diff --cached --quiet -- data/social-followers.json data/social-followers-live.json; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: atualizar snapshot TikTok'
          for tentativa in 1 2 3; do
            if git push; then break; fi
            echo "Push rejeitado (tentativa $tentativa/3), atualizando e tentando de novo..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            [ "$tentativa" -eq 3 ] && exit 1
          done

      # Mesmo passo final de sync-meta-followers.yml: followers-dashboard.js só lê
      # portalStore/followers-vonder-v1 no Firestore, nunca os JSON públicos acima.
      - name: Publicar snapshot protegido no Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo '::warning::FIREBASE_SERVICE_ACCOUNT_KEY não configurado — pulando a gravação em portalStore/followers-vonder-v1.'
            exit 0
          fi
          pip install --quiet firebase-admin
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          import firebase_admin
          from firebase_admin import credentials, firestore

          cred = credentials.Certificate(json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_KEY']))
          firebase_admin.initialize_app(cred)
          db = firestore.client()

          published = json.loads(Path('data/social-followers.json').read_text(encoding='utf-8'))
          live = json.loads(Path('data/social-followers-live.json').read_text(encoding='utf-8'))

          db.collection('portalStore').document('followers-vonder-v1').set({
              'v': {'published': published, 'live': live},
              'updated_at': int(time.time() * 1000),
              'updatedAt': firestore.SERVER_TIMESTAMP,
          })
          print('Firestore atualizado:', live['platforms']['TikTok']['followers'], 'seguidores TikTok em', live['updatedAt'])
          PY
