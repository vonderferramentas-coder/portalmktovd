name: Sincronizar seguidores YouTube

# Mesmo padrão de sync-meta-followers.yml, mas para o canal Vonder no YouTube. Os dois
# workflows escrevem nos mesmos dois arquivos (data/social-followers-live.json e
# data/social-followers.json) em paralelo, cada um mexendo só na própria chave
# ('YouTube' aqui, 'Instagram'/'Facebook' lá) — nunca reconstroem o documento inteiro,
# senão um apagaria o dado do outro a cada execução.

on:
  schedule:
    # Offset de 7 min em relação ao */15 da Meta para reduzir a chance de as duas
    # execuções tentarem publicar no mesmo minuto exato.
    - cron: '7,22,37,52 * * * *'
    # Fechamento diário 5 min antes do da Meta (23:50 de São Paulo = 02:50 UTC).
    - cron: '50 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Consultar estatísticas do canal
        id: youtube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: 'UCflcAVLpPmH-03R-njMSayw'
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_API_KEY"
          curl --fail --silent --show-error --get \
            "https://www.googleapis.com/youtube/v3/channels" \
            --data-urlencode 'part=snippet,statistics' \
            --data-urlencode "id=$YOUTUBE_CHANNEL_ID" \
            --data-urlencode "key=$YOUTUBE_API_KEY" \
            --output youtube-response.json
          # Se o canal ocultar a contagem de inscritos (config. do YouTube), a API ainda
          # devolve subscriberCount, mas com valor falso (geralmente "0") — falhar alto em
          # vez de gravar um número que não é o real.
          if [ "$(jq -r '.items[0].statistics.hiddenSubscriberCount' youtube-response.json)" = 'true' ]; then
            echo '::error::O canal Vonder está ocultando a contagem de inscritos (hiddenSubscriberCount=true) — a API não devolve o número real. Reverter isso nas configurações do canal no YouTube Studio.'
            exit 1
          fi
          # subscriberCount/viewCount vêm como string na API do YouTube (não como número).
          echo "subscribers=$(jq -er '.items[0].statistics.subscriberCount | strings' youtube-response.json)" >> "$GITHUB_OUTPUT"
          echo "views=$(jq -er '.items[0].statistics.viewCount | strings' youtube-response.json)" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -er '.items[0].snippet.title | strings' youtube-response.json)" >> "$GITHUB_OUTPUT"

      - name: Atualizar snapshot público
        env:
          SUBSCRIBERS: ${{ steps.youtube.outputs.subscribers }}
          VIEWS: ${{ steps.youtube.outputs.views }}
          TITLE: ${{ steps.youtube.outputs.title }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          # Mescla só a chave YouTube em 'platforms', sem tocar em Instagram/Facebook
          # (gravados por sync-meta-followers.yml no mesmo arquivo, em paralelo).
          path = Path('data/social-followers-live.json')
          document = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'version': 2, 'platforms': {}}
          platforms = dict(document.get('platforms') or {})
          platforms['YouTube'] = {
              'accountId': 'UCflcAVLpPmH-03R-njMSayw',
              'username': os.environ['TITLE'],
              'followers': int(os.environ['SUBSCRIBERS']),
              'views': int(os.environ['VIEWS']),
              'source': 'youtube_data_api'
          }
          document.update({
              'version': 2,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'platforms': platforms
          })
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Fechar histórico diário
        if: github.event.schedule == '50 2 * * *' || github.event_name == 'workflow_dispatch'
        env:
          SUBSCRIBERS: ${{ steps.youtube.outputs.subscribers }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path('data/social-followers.json')
          document = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'version': 2, 'history': []}
          # A execução ocorre às 02:50 UTC, equivalente a 23:50 em São Paulo.
          closing_date = (datetime.now(timezone.utc) - timedelta(hours=3)).date().isoformat()
          history = {item['date']: item for item in document.get('history', []) if item.get('date')}
          # Mescla só YouTube no dia: preserva Instagram/Facebook que sync-meta-followers.yml
          # já fechou (ou vier a fechar) no mesmo dia.
          existing_day = dict(history.get(closing_date) or {'date': closing_date})
          existing_day['followers'] = dict(existing_day.get('followers') or {})
          existing_day['followers']['YouTube'] = int(os.environ['SUBSCRIBERS'])
          history[closing_date] = existing_day
          history = [history[day] for day in sorted(history)]
          document.update({
              'version': 2,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'history': history
          })
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar dados atualizados
        run: |
          git add data/social-followers.json data/social-followers-live.json
          if git diff --cached --quiet -- data/social-followers.json data/social-followers-live.json; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: atualizar snapshot YouTube'
          # sync-meta-followers.yml grava nos mesmos dois arquivos em paralelo (chaves
          # Instagram/Facebook, em campos que este workflow não toca) — um push rejeitado
          # por não estar atualizado tenta de novo com rebase antes de desistir.
          for tentativa in 1 2 3; do
            if git push; then break; fi
            echo "Push rejeitado (tentativa $tentativa/3), atualizando e tentando de novo..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            [ "$tentativa" -eq 3 ] && exit 1
          done

      # Mesmo mecanismo de sync-meta-followers.yml: grava o snapshot combinado direto em
      # portalStore/followers-vonder-v1 via Admin SDK, para o painel não depender de alguém
      # reabrir migrate-followers.html. Reaproveita o mesmo secret FIREBASE_SERVICE_ACCOUNT_KEY.
      - name: Publicar snapshot protegido no Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo '::warning::FIREBASE_SERVICE_ACCOUNT_KEY não configurado — pulando a gravação em portalStore/followers-vonder-v1.'
            exit 0
          fi
          pip install --quiet firebase-admin
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          import firebase_admin
          from firebase_admin import credentials, firestore

          cred = credentials.Certificate(json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_KEY']))
          firebase_admin.initialize_app(cred)
          db = firestore.client()

          published = json.loads(Path('data/social-followers.json').read_text(encoding='utf-8'))
          live = json.loads(Path('data/social-followers-live.json').read_text(encoding='utf-8'))

          db.collection('portalStore').document('followers-vonder-v1').set({
              'v': {'published': published, 'live': live},
              'updated_at': int(time.time() * 1000),
              'updatedAt': firestore.SERVER_TIMESTAMP,
          })
          youtube = live.get('platforms', {}).get('YouTube', {})
          print('Firestore atualizado:', youtube.get('followers'), 'inscritos em', live['updatedAt'])
          PY
