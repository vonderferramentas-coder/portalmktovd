name: Reconstruir histórico de posts do Instagram

# Carga única (workflow_dispatch). sync-meta-posts.yml só mantém frescos (thumbnail e métricas
# atualizadas a cada 6h) os ~30 posts mais recentes — esta carga pagina o /media inteiro da
# conta para trazer o resto do histórico, para que o ranking "Melhores posts" enxergue posts
# fora dessa janela também. Sem isso, filtrar por "Este ano"/"Desde o início" só reordenava os
# mesmos ~30 posts recentes, e o "melhor post do ano" acabava sempre sendo um post recente por
# falta de dado, não por ele realmente ser o melhor.
#
# Só ADICIONA posts que ainda não existem em data/social-posts.json — nunca sobrescreve um id
# que já esteja lá, porque quem mantém os ~30 mais recentes de fato atualizados é
# sync-meta-posts.yml. E não guarda thumbnail para os posts mais antigos: a Meta assina e
# expira a URL de imagem depois de um tempo, então guardar agora só deixaria a miniatura
# quebrada mais pra frente sem re-coleta — sem thumbnail o card já cai de volta pro estado "sem
# imagem" (ver renderPostCard em followers-dashboard.js).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Paginar histórico completo de posts
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ID: '17841403154695997'
        run: |
          set -euo pipefail
          test -n "$META_PAGE_ACCESS_TOKEN"
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ['META_PAGE_ACCESS_TOKEN']
          ig_id = os.environ['META_INSTAGRAM_ID']
          api = 'https://graph.facebook.com/v26.0'
          # Mesmo corte de sync-meta-posts.yml — ver o comentário ponytail lá para o motivo.
          MAX_CAPTION_CHARS = 300

          def get(url):
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          def metric_value(insights, name):
              for entry in insights.get('data', []):
                  if entry.get('name') == name:
                      values = entry.get('values') or []
                      if values:
                          return values[0].get('value')
              return None

          path = Path('data/social-posts.json')
          existing = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'version': 1, 'posts': []}
          known_ids = {post['id'] for post in existing.get('posts', [])}

          media_fields = 'id,caption,media_type,media_product_type,permalink,timestamp,like_count,comments_count'
          url = f'{api}/{ig_id}/media?fields={media_fields}&limit=100'
          added = []
          falhas = 0
          pagina = 0
          while url:
              pagina += 1
              listing = get(url)
              items = listing.get('data', [])
              novos_da_pagina = 0
              for item in items:
                  media_id = item['id']
                  if media_id in known_ids:
                      continue
                  novos_da_pagina += 1
                  total_interactions = views = saved = None
                  try:
                      insights = get(f"{api}/{media_id}/insights?metric=total_interactions,views,saved")
                      total_interactions = metric_value(insights, 'total_interactions')
                      views = metric_value(insights, 'views')
                      saved = metric_value(insights, 'saved')
                  except urllib.error.HTTPError:
                      falhas += 1
                  added.append({
                      'id': media_id,
                      'caption': (item.get('caption') or '')[:MAX_CAPTION_CHARS],
                      'mediaType': item.get('media_type'),
                      'mediaProductType': item.get('media_product_type'),
                      'permalink': item.get('permalink'),
                      'thumbnailUrl': None,
                      'timestamp': item.get('timestamp'),
                      'likeCount': item.get('like_count', 0) or 0,
                      'commentsCount': item.get('comments_count', 0) or 0,
                      'totalInteractions': total_interactions,
                      'views': views,
                      'saved': saved,
                  })
                  known_ids.add(media_id)
                  time.sleep(0.2)  # não martela a API em sequência
              print(f'Página {pagina}: {len(items)} posts recebidos, {novos_da_pagina} novos.')
              url = (listing.get('paging') or {}).get('next')

          by_id = {post['id']: post for post in existing.get('posts', [])}
          for post in added:
              by_id[post['id']] = post
          merged = sorted(by_id.values(), key=lambda post: post.get('timestamp') or '', reverse=True)

          document = {
              'version': 1,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'posts': merged,
          }
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Reconstrução concluída: +{len(added)} posts novos ({falhas} sem insights), {len(merged)} no total.')
          PY

      - name: Publicar dados atualizados
        run: |
          git add data/social-posts.json
          if git diff --cached --quiet -- data/social-posts.json; then
            echo 'Nenhum post novo encontrado — histórico já estava completo.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: reconstruir histórico de posts do Instagram'
          git push

      # Mesmo padrão de sync-meta-posts.yml — ver lá o comentário ponytail sobre o limite de
      # 1 MiB por documento do Firestore.
      - name: Publicar posts no Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo '::warning::FIREBASE_SERVICE_ACCOUNT_KEY não configurado — pulando a gravação em portalStore/posts-vonder-v1.'
            exit 0
          fi
          pip install --quiet firebase-admin
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          import firebase_admin
          from firebase_admin import credentials, firestore

          cred = credentials.Certificate(json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_KEY']))
          firebase_admin.initialize_app(cred)
          db = firestore.client()

          published = json.loads(Path('data/social-posts.json').read_text(encoding='utf-8'))
          posts = published['posts']

          FIRESTORE_MAX_BYTES = 900_000
          encoded = json.dumps(posts, ensure_ascii=False).encode('utf-8')
          if len(encoded) > FIRESTORE_MAX_BYTES:
              kept, total = [], 2
              for post in posts:
                  size = len(json.dumps(post, ensure_ascii=False).encode('utf-8')) + 1
                  if total + size > FIRESTORE_MAX_BYTES:
                      break
                  kept.append(post)
                  total += size
              print(f'::warning::Histórico de posts ({len(posts)}) passou de {FIRESTORE_MAX_BYTES} bytes — publicando só os {len(kept)} mais recentes no Firestore. Arquivo completo continua em data/social-posts.json.')
              posts = kept

          db.collection('portalStore').document('posts-vonder-v1').set({
              'v': {**published, 'posts': posts},
              'updated_at': int(time.time() * 1000),
              'updatedAt': firestore.SERVER_TIMESTAMP,
          })
          print('Firestore atualizado:', len(posts), 'posts publicados de', len(published['posts']), 'no total em', published['updatedAt'])
          PY
