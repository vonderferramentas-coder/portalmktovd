name: Sincronizar seguidores Meta

on:
  schedule:
    # Snapshot a cada 15 min. O dashboard mostra o horário efetivo, pois o
    # GitHub pode atrasar uma execução agendada.
    - cron: '*/15 * * * *'
    # Fechamento diário às 23:55 de São Paulo (02:55 UTC).
    - cron: '55 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serializa TODOS os workflows deste projeto que fazem git push num único grupo: evita duas
# execuções colidindo no mesmo commit/arquivo de dados (visto na prática entre a coleta da
# VONDER e da Ferramentas Gerais rodando perto uma da outra — retry sozinho não bastava
# quando o conflito era de conteúdo de verdade, não só "não estava atualizado"). Uma
# execução espera a outra terminar em vez de tentar em paralelo e falhar.
concurrency:
  group: portal-dados-git-push
  cancel-in-progress: false

jobs:
  sync-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Consultar seguidores do Instagram
        id: meta
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ID: '17841403154695997'
        run: |
          set -euo pipefail
          test -n "$META_PAGE_ACCESS_TOKEN"
          curl --fail --silent --show-error --get \
            "https://graph.facebook.com/v26.0/$META_INSTAGRAM_ID" \
            --data-urlencode 'fields=followers_count,username' \
            --data-urlencode "access_token=$META_PAGE_ACCESS_TOKEN" \
            --output meta-response.json
          echo "followers=$(jq -er '.followers_count | numbers' meta-response.json)" >> "$GITHUB_OUTPUT"
          echo "username=$(jq -er '.username | strings' meta-response.json)" >> "$GITHUB_OUTPUT"

      # A Página do Facebook (dona da conta do Instagram acima) responde com o mesmo token de
      # Página — confirmado em diagnostico-meta-facebook.yml, sem precisar de escopo novo.
      - name: Consultar seguidores do Facebook
        id: metaFacebook
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_FACEBOOK_PAGE_ID: '262406600508752'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get \
            "https://graph.facebook.com/v26.0/$META_FACEBOOK_PAGE_ID" \
            --data-urlencode 'fields=followers_count,name' \
            --data-urlencode "access_token=$META_PAGE_ACCESS_TOKEN" \
            --output meta-facebook-response.json
          echo "followers=$(jq -er '.followers_count | numbers' meta-facebook-response.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -er '.name | strings' meta-facebook-response.json)" >> "$GITHUB_OUTPUT"

      - name: Atualizar snapshot público
        env:
          FOLLOWERS: ${{ steps.meta.outputs.followers }}
          USERNAME: ${{ steps.meta.outputs.username }}
          FB_FOLLOWERS: ${{ steps.metaFacebook.outputs.followers }}
          FB_NAME: ${{ steps.metaFacebook.outputs.name }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          # Mescla só as chaves Instagram/Facebook em 'platforms', sem sobrescrever o
          # documento inteiro: sync-youtube-followers.yml grava a chave YouTube no mesmo
          # arquivo em paralelo, e um `document = {...}` inteiro aqui apagaria esse dado
          # a cada execução (o Meta roda a cada 15 min).
          path = Path('data/social-followers-live.json')
          document = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'version': 2, 'platforms': {}}
          platforms = dict(document.get('platforms') or {})
          platforms['Instagram'] = {
              'accountId': '17841403154695997',
              'username': os.environ['USERNAME'],
              'followers': int(os.environ['FOLLOWERS']),
              'source': 'meta_graph_api'
          }
          platforms['Facebook'] = {
              'accountId': '262406600508752',
              'username': os.environ['FB_NAME'],
              'followers': int(os.environ['FB_FOLLOWERS']),
              'source': 'meta_graph_api'
          }
          document.update({
              'version': 2,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'platforms': platforms
          })
          document.pop('source', None)
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Fechar histórico diário
        if: github.event.schedule == '55 2 * * *' || github.event_name == 'workflow_dispatch'
        env:
          FOLLOWERS: ${{ steps.meta.outputs.followers }}
          FB_FOLLOWERS: ${{ steps.metaFacebook.outputs.followers }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path('data/social-followers.json')
          document = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'version': 2, 'history': []}
          # A execução ocorre às 02:55 UTC, equivalente a 23:55 em São Paulo.
          closing_date = (datetime.now(timezone.utc) - timedelta(hours=3)).date().isoformat()
          history = {item['date']: item for item in document.get('history', []) if item.get('date')}
          # Mescla só Instagram/Facebook no dia: preserva a chave YouTube que
          # sync-youtube-followers.yml pode já ter fechado no mesmo dia (ou vier a
          # fechar depois) — um `history.append` substituindo o dia inteiro a apagaria.
          existing_day = dict(history.get(closing_date) or {'date': closing_date})
          existing_day['followers'] = dict(existing_day.get('followers') or {})
          existing_day['followers']['Instagram'] = int(os.environ['FOLLOWERS'])
          existing_day['followers']['Facebook'] = int(os.environ['FB_FOLLOWERS'])
          history[closing_date] = existing_day
          history = [history[day] for day in sorted(history)]
          document.update({
              'version': 2,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'history': history
          })
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar dados atualizados
        run: |
          git add data/social-followers.json data/social-followers-live.json
          if git diff --cached --quiet -- data/social-followers.json data/social-followers-live.json; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: atualizar snapshot Meta'
          # sync-youtube-followers.yml grava nos mesmos dois arquivos em paralelo (chave
          # YouTube, em campos que este workflow não toca) — um push rejeitado por não estar
          # atualizado tenta de novo com rebase antes de desistir, em vez de falhar a coleta.
          for tentativa in 1 2 3; do
            if git push; then break; fi
            echo "Push rejeitado (tentativa $tentativa/3), atualizando e tentando de novo..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            [ "$tentativa" -eq 3 ] && exit 1
          done

      # O painel (followers-dashboard.js) só lê portalStore/followers-vonder-v1 no Firestore,
      # nunca mais os JSON públicos acima — eles continuam publicados só como origem/backup
      # (ver docs/ARQUITETURA-E-INTEGRACOES.md, "Migração do painel de seguidores"). Sem este
      # passo, a coleta seguia rodando normalmente mas o painel nunca via o resultado, porque
      # dependia de alguém reabrir migrate-followers.html manualmente a cada atualização.
      # Usa o Admin SDK (chave de serviço, nunca exposta ao navegador) para gravar direto,
      # sem passar pela sessão de um usuário nem pelas regras client-side do Firestore.
      - name: Publicar snapshot protegido no Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo '::warning::FIREBASE_SERVICE_ACCOUNT_KEY não configurado — pulando a gravação em portalStore/followers-vonder-v1. O painel continuará mostrando "Aguardando coleta" até o secret ser cadastrado.'
            exit 0
          fi
          pip install --quiet firebase-admin
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          import firebase_admin
          from firebase_admin import credentials, firestore

          cred = credentials.Certificate(json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_KEY']))
          firebase_admin.initialize_app(cred)
          db = firestore.client()

          published = json.loads(Path('data/social-followers.json').read_text(encoding='utf-8'))
          live = json.loads(Path('data/social-followers-live.json').read_text(encoding='utf-8'))

          # Mesmo formato gravado por migrate-followers.js (v/updated_at/updatedAt), para que
          # a leitura em followers-dashboard.js e a migração manual continuem compatíveis.
          db.collection('portalStore').document('followers-vonder-v1').set({
              'v': {'published': published, 'live': live},
              'updated_at': int(time.time() * 1000),
              'updatedAt': firestore.SERVER_TIMESTAMP,
          })
          print('Firestore atualizado:', live['platforms']['Instagram']['followers'], 'seguidores em', live['updatedAt'])
          PY

  # Segunda marca coletada no MESMO agendamento acima — nunca um cron/workflow novo (ver
  # docs/ARQUITETURA-E-INTEGRACOES.md, pedido explícito de não multiplicar disparos no GitHub
  # Actions). Arquivos e documento do Firestore próprios (nunca os -vonder-*) para manter as
  # marcas isoladas, mesmo padrão de followers-dashboard.js. Cada passo de rede tem
  # `continue-on-error: true` para que uma falha pontual da API da Meta pra essa marca nunca
  # derrube a coleta da VONDER, que já rodou acima nos passos anteriores deste mesmo job.
  sync-instagram-ferramentas-gerais:
    needs: sync-instagram
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Consultar seguidores do Instagram (Ferramentas Gerais)
        id: metaFg
        continue-on-error: true
        env:
          META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS: ${{ secrets.META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS }}
          META_INSTAGRAM_ID: '17841404085550539'
        run: |
          set -euo pipefail
          test -n "$META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS"
          curl --fail --silent --show-error --get \
            "https://graph.facebook.com/v26.0/$META_INSTAGRAM_ID" \
            --data-urlencode 'fields=followers_count,username' \
            --data-urlencode "access_token=$META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS" \
            --output meta-fg-response.json
          echo "followers=$(jq -er '.followers_count | numbers' meta-fg-response.json)" >> "$GITHUB_OUTPUT"
          echo "username=$(jq -er '.username | strings' meta-fg-response.json)" >> "$GITHUB_OUTPUT"

      - name: Consultar seguidores do Facebook (Ferramentas Gerais)
        id: metaFacebookFg
        continue-on-error: true
        env:
          META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS: ${{ secrets.META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS }}
          META_FACEBOOK_PAGE_ID: '219931821407833'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get \
            "https://graph.facebook.com/v26.0/$META_FACEBOOK_PAGE_ID" \
            --data-urlencode 'fields=followers_count,name' \
            --data-urlencode "access_token=$META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS" \
            --output meta-facebook-fg-response.json
          echo "followers=$(jq -er '.followers_count | numbers' meta-facebook-fg-response.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -er '.name | strings' meta-facebook-fg-response.json)" >> "$GITHUB_OUTPUT"

      - name: Atualizar snapshot público (Ferramentas Gerais)
        if: steps.metaFg.outcome == 'success'
        env:
          FOLLOWERS: ${{ steps.metaFg.outputs.followers }}
          USERNAME: ${{ steps.metaFg.outputs.username }}
          FB_OUTCOME: ${{ steps.metaFacebookFg.outcome }}
          FB_FOLLOWERS: ${{ steps.metaFacebookFg.outputs.followers }}
          FB_NAME: ${{ steps.metaFacebookFg.outputs.name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('data/social-followers-ferramentas-gerais-live.json')
          document = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'version': 2, 'platforms': {}}
          platforms = dict(document.get('platforms') or {})
          platforms['Instagram'] = {
              'accountId': '17841404085550539',
              'username': os.environ['USERNAME'],
              'followers': int(os.environ['FOLLOWERS']),
              'source': 'meta_graph_api'
          }
          if os.environ.get('FB_OUTCOME') == 'success' and os.environ.get('FB_FOLLOWERS'):
              platforms['Facebook'] = {
                  'accountId': '219931821407833',
                  'username': os.environ['FB_NAME'],
                  'followers': int(os.environ['FB_FOLLOWERS']),
                  'source': 'meta_graph_api'
              }
          document.update({
              'version': 2,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'platforms': platforms
          })
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Fechar histórico diário (Ferramentas Gerais)
        if: steps.metaFg.outcome == 'success' && (github.event.schedule == '55 2 * * *' || github.event_name == 'workflow_dispatch')
        env:
          FOLLOWERS: ${{ steps.metaFg.outputs.followers }}
          FB_OUTCOME: ${{ steps.metaFacebookFg.outcome }}
          FB_FOLLOWERS: ${{ steps.metaFacebookFg.outputs.followers }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path('data/social-followers-ferramentas-gerais.json')
          document = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'version': 2, 'history': []}
          closing_date = (datetime.now(timezone.utc) - timedelta(hours=3)).date().isoformat()
          history = {item['date']: item for item in document.get('history', []) if item.get('date')}
          existing_day = dict(history.get(closing_date) or {'date': closing_date})
          existing_day['followers'] = dict(existing_day.get('followers') or {})
          existing_day['followers']['Instagram'] = int(os.environ['FOLLOWERS'])
          if os.environ.get('FB_OUTCOME') == 'success' and os.environ.get('FB_FOLLOWERS'):
              existing_day['followers']['Facebook'] = int(os.environ['FB_FOLLOWERS'])
          history[closing_date] = existing_day
          history = [history[day] for day in sorted(history)]
          document.update({
              'version': 2,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'history': history
          })
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar dados atualizados (Ferramentas Gerais)
        if: steps.metaFg.outcome == 'success'
        run: |
          git add data/social-followers-ferramentas-gerais.json data/social-followers-ferramentas-gerais-live.json
          if git diff --cached --quiet -- data/social-followers-ferramentas-gerais.json data/social-followers-ferramentas-gerais-live.json; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: atualizar snapshot Meta (Ferramentas Gerais)'
          for tentativa in 1 2 3; do
            if git push; then break; fi
            echo "Push rejeitado (tentativa $tentativa/3), atualizando e tentando de novo..."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort
              echo 'Rebase conflitou — abortado, tentando de novo do zero.'
            fi
            [ "$tentativa" -eq 3 ] && exit 1
          done

      # Documento próprio (followers-ferramentas-gerais-v1), nunca followers-vonder-v1 — mesmo
      # isolamento por marca que o resto do painel já segue.
      - name: Publicar snapshot protegido no Firestore (Ferramentas Gerais)
        if: steps.metaFg.outcome == 'success'
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo '::warning::FIREBASE_SERVICE_ACCOUNT_KEY não configurado — pulando a gravação em portalStore/followers-ferramentas-gerais-v1.'
            exit 0
          fi
          pip install --quiet firebase-admin
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          import firebase_admin
          from firebase_admin import credentials, firestore

          cred = credentials.Certificate(json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_KEY']))
          firebase_admin.initialize_app(cred)
          db = firestore.client()

          live_path = Path('data/social-followers-ferramentas-gerais-live.json')
          published_path = Path('data/social-followers-ferramentas-gerais.json')
          live = json.loads(live_path.read_text(encoding='utf-8')) if live_path.exists() else {'version': 2, 'platforms': {}}
          published = json.loads(published_path.read_text(encoding='utf-8')) if published_path.exists() else {'version': 2, 'history': []}

          db.collection('portalStore').document('followers-ferramentas-gerais-v1').set({
              'v': {'published': published, 'live': live},
              'updated_at': int(time.time() * 1000),
              'updatedAt': firestore.SERVER_TIMESTAMP,
          })
          print('Firestore atualizado (Ferramentas Gerais):', live.get('platforms', {}).get('Instagram', {}).get('followers'), 'seguidores em', live.get('updatedAt'))
          PY