name: Sincronizar seguidores Meta

on:
  schedule:
    # Snapshot a cada 15 min. O dashboard mostra o horário efetivo, pois o
    # GitHub pode atrasar uma execução agendada.
    - cron: '*/15 * * * *'
    # Fechamento diário às 23:55 de São Paulo (02:55 UTC).
    - cron: '55 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Consultar seguidores do Instagram
        id: meta
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ID: '17841403154695997'
        run: |
          set -euo pipefail
          test -n "$META_PAGE_ACCESS_TOKEN"
          curl --fail --silent --show-error --get \
            "https://graph.facebook.com/v26.0/$META_INSTAGRAM_ID" \
            --data-urlencode 'fields=followers_count,username' \
            --data-urlencode "access_token=$META_PAGE_ACCESS_TOKEN" \
            --output meta-response.json
          echo "followers=$(jq -er '.followers_count | numbers' meta-response.json)" >> "$GITHUB_OUTPUT"
          echo "username=$(jq -er '.username | strings' meta-response.json)" >> "$GITHUB_OUTPUT"

      - name: Atualizar snapshot público
        env:
          FOLLOWERS: ${{ steps.meta.outputs.followers }}
          USERNAME: ${{ steps.meta.outputs.username }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('data/social-followers-live.json')
          document = {
              'version': 2,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'source': 'meta_graph_api',
              'platforms': {'Instagram': {
                  'accountId': '17841403154695997',
                  'username': os.environ['USERNAME'],
                  'followers': int(os.environ['FOLLOWERS'])
              }}
          }
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Fechar histórico diário
        if: github.event.schedule == '55 2 * * *' || github.event_name == 'workflow_dispatch'
        env:
          FOLLOWERS: ${{ steps.meta.outputs.followers }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path('data/social-followers.json')
          document = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'version': 2, 'history': []}
          # A execução ocorre às 02:55 UTC, equivalente a 23:55 em São Paulo.
          closing_date = (datetime.now(timezone.utc) - timedelta(hours=3)).date().isoformat()
          history = [item for item in document.get('history', []) if item.get('date') != closing_date]
          history.append({'date': closing_date, 'followers': {'Instagram': int(os.environ['FOLLOWERS'])}})
          history.sort(key=lambda item: item['date'])
          document.update({
              'version': 2,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'history': history[-730:]
          })
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar dados atualizados
        run: |
          git add data/social-followers.json data/social-followers-live.json
          if git diff --cached --quiet -- data/social-followers.json data/social-followers-live.json; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: atualizar snapshot Meta'
          git push

      # O painel (followers-dashboard.js) só lê portalStore/followers-vonder-v1 no Firestore,
      # nunca mais os JSON públicos acima — eles continuam publicados só como origem/backup
      # (ver docs/ARQUITETURA-E-INTEGRACOES.md, "Migração do painel de seguidores"). Sem este
      # passo, a coleta seguia rodando normalmente mas o painel nunca via o resultado, porque
      # dependia de alguém reabrir migrate-followers.html manualmente a cada atualização.
      # Usa o Admin SDK (chave de serviço, nunca exposta ao navegador) para gravar direto,
      # sem passar pela sessão de um usuário nem pelas regras client-side do Firestore.
      - name: Publicar snapshot protegido no Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo '::warning::FIREBASE_SERVICE_ACCOUNT_KEY não configurado — pulando a gravação em portalStore/followers-vonder-v1. O painel continuará mostrando "Aguardando coleta" até o secret ser cadastrado.'
            exit 0
          fi
          pip install --quiet firebase-admin
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          import firebase_admin
          from firebase_admin import credentials, firestore

          cred = credentials.Certificate(json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_KEY']))
          firebase_admin.initialize_app(cred)
          db = firestore.client()

          published = json.loads(Path('data/social-followers.json').read_text(encoding='utf-8'))
          live = json.loads(Path('data/social-followers-live.json').read_text(encoding='utf-8'))

          # Mesmo formato gravado por migrate-followers.js (v/updated_at/updatedAt), para que
          # a leitura em followers-dashboard.js e a migração manual continuem compatíveis.
          db.collection('portalStore').document('followers-vonder-v1').set({
              'v': {'published': published, 'live': live},
              'updated_at': int(time.time() * 1000),
              'updatedAt': firestore.SERVER_TIMESTAMP,
          })
          print('Firestore atualizado:', live['platforms']['Instagram']['followers'], 'seguidores em', live['updatedAt'])
          PY