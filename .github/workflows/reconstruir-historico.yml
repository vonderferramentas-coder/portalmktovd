name: Reconstruir histórico de seguidores

# Carga única. A Meta não guarda o total de seguidores ao longo do tempo, mas guarda,
# por dia, quantas contas entraram e quantas saíram. Sabendo o total de hoje, dá para
# caminhar para trás: total de ontem = total de hoje menos o saldo de hoje.
#
# As fronteiras de dia vêm do próprio follower_count (end_time às 07:00 UTC, meia-noite
# no fuso da conta), para que a janela consultada case exatamente com o dia da Meta.
#
# Os pontos reconstruídos ficam marcados com "source": "reconstruido" no arquivo, e
# nunca sobrescrevem um dia que o coletor já mediu de fato.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Coletar saldo diário na Meta
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ID: '17841403154695997'
        run: |
          set -euo pipefail
          API="https://graph.facebook.com/v26.0"
          AUTH="Authorization: Bearer $META_PAGE_ACCESS_TOKEN"

          # Total de agora: é a âncora de onde a caminhada para trás começa.
          curl -sS --fail -H "$AUTH" "$API/$META_INSTAGRAM_ID?fields=followers_count" -o atual.json
          jq -er '.followers_count | numbers' atual.json > /dev/null

          # Fronteiras de dia autoritativas, direto da Meta.
          SINCE="$(date -u -d '29 days ago' +%s)"
          UNTIL="$(date -u -d 'yesterday' +%s)"
          curl -sS --fail -H "$AUTH" \
            "$API/$META_INSTAGRAM_ID/insights?metric=follower_count&period=day&since=$SINCE&until=$UNTIL" \
            -o fronteiras.json

          jq -r '.data[0].values[].end_time' fronteiras.json > limites.txt
          echo "Dias retornados pela Meta: $(wc -l < limites.txt)"

          # Referência independente: o follower_count mede as mesmas entradas por dia.
          # Serve para conferir a reconstrução antes de gravar qualquer coisa.
          jq '[.data[0].values[]?.value] | add // 0' fronteiras.json > entradas_referencia.txt

          # Um dia por consulta: com janela de 24h a resposta traz o total daquele dia,
          # separado em quem entrou (FOLLOWER) e quem saiu (NON_FOLLOWER).
          echo '[]' > saldos.json
          anterior=''
          while read -r limite; do
            fim="$(date -u -d "$limite" +%s)"
            if [ -n "$anterior" ]; then
              # +1 segundo: o 'until' da Meta é inclusivo, então uma janela que começa
              # exatamente na fronteira do dia anterior devolve dois dias somados.
              inicio=$((anterior + 1))
              resposta="$(curl -sS -H "$AUTH" \
                "$API/$META_INSTAGRAM_ID/insights?metric=follows_and_unfollows&period=day&metric_type=total_value&breakdown=follow_type&since=$inicio&until=$fim")"
              # Os '?' são necessários: num dia sem dados a Meta devolve "data": [], e sem
              # eles o jq aborta ao iterar sobre null, derrubando a coleta inteira por
              # causa de um único dia vazio.
              extrair() {
                printf '%s' "$resposta" \
                  | jq -r --arg tipo "$1" '[.data[]?.total_value?.breakdowns[]?.results[]? | select(.dimension_values[0]==$tipo) | .value] | first // empty' \
                  2>/dev/null || true
              }
              entraram="$(extrair FOLLOWER)"
              sairam="$(extrair NON_FOLLOWER)"
              if [ -n "$entraram" ] && [ -n "$sairam" ]; then
                dia="$(date -u -d "$limite" +%F)"
                jq --arg d "$dia" --argjson e "$entraram" --argjson s "$sairam" \
                  '. + [{date:$d, entraram:$e, sairam:$s, saldo:($e-$s)}]' saldos.json > tmp.json
                mv tmp.json saldos.json
              else
                echo "Sem dado utilizável para o dia que termina em $limite"
                printf 'Resposta recebida: %s\n' "${resposta:0:300}"
              fi
            fi
            anterior="$fim"
          done < limites.txt

          echo "Dias com saldo apurado: $(jq 'length' saldos.json)"

      - name: Reconstruir os totais e mesclar
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          atual = json.loads(Path('atual.json').read_text())['followers_count']
          saldos = json.loads(Path('saldos.json').read_text())
          caminho = Path('data/social-followers.json')
          doc = json.loads(caminho.read_text(encoding='utf-8')) if caminho.exists() else {'version': 1, 'history': []}

          # Descarta reconstruções anteriores antes de qualquer coisa: se esta rodada não
          # passar na conferência, o arquivo fica só com medição real, e não com número
          # errado de uma tentativa passada.
          historico = {
              item['date']: item for item in doc.get('history', [])
              if item.get('source') != 'reconstruido'
          }

          # Conferência: o follower_count mede as entradas do mesmo dia por outro caminho.
          # Se os dois discordarem muito, a janela de consulta está errada — foi assim que
          # a primeira tentativa dobrou todos os números — e nada deve ser gravado.
          referencia = {
              item['end_time'][:10]: item['value']
              for item in json.loads(Path('fronteiras.json').read_text())['data'][0]['values']
          }
          # Um dia faltando desloca o total de todos os dias anteriores a ele, porque a
          # caminhada para trás é encadeada. Melhor recusar do que publicar série torta.
          esperados = sorted(referencia)[1:]
          faltando = [dia for dia in esperados if dia not in {item['date'] for item in saldos}]

          divergentes = []
          for item in saldos:
              esperado = referencia.get(item['date'])
              if esperado is None or esperado == 0:
                  continue
              desvio = abs(item['entraram'] - esperado) / esperado
              if desvio > 0.15:
                  divergentes.append((item['date'], item['entraram'], esperado, desvio))

          if divergentes or faltando:
              linhas = ['## Reconstrução recusada', '']
              if faltando:
                  linhas += [
                      f'**{len(faltando)} dia(s) sem saldo apurado:** {", ".join(faltando[:10])}.',
                      'Como o total de cada dia é calculado a partir do dia seguinte, um buraco',
                      'desloca tudo o que vem antes dele.', ''
                  ]
              if divergentes:
                  linhas += [
                      'As entradas apuradas não batem com o `follower_count` do mesmo dia, que mede',
                      'a mesma coisa por outro caminho.', '',
                      '| Dia | follows_and_unfollows | follower_count | Desvio |', '|---|---:|---:|---:|'
                  ]
                  for dia, obtido, esperado, desvio in divergentes[:15]:
                      linhas.append(f'| {dia} | {obtido} | {esperado} | {desvio:.0%} |')
              linhas += ['', 'Nada foi gravado; o arquivo ficou apenas com as medições reais do coletor.']
              doc['history'] = [historico[dia] for dia in sorted(historico)][-730:]
              caminho.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              Path('resumo.md').write_text('\n'.join(linhas) + '\n', encoding='utf-8')
              raise SystemExit(0)

          # Caminha do dia mais recente para o mais antigo. O total do dia anterior é o
          # total do dia menos o saldo do dia seguinte.
          saldos.sort(key=lambda item: item['date'])
          total = atual
          reconstruidos = {}
          for item in reversed(saldos):
              reconstruidos[item['date']] = total
              total -= item['saldo']

          novos = 0
          for dia, valor in sorted(reconstruidos.items()):
              existente = historico.get(dia)
              # Nunca sobrescreve medição real do coletor.
              if existente and existente.get('source') != 'reconstruido':
                  continue
              historico[dia] = {'date': dia, 'followers': {'Instagram': int(valor)}, 'source': 'reconstruido'}
              novos += 1

          doc['version'] = 1
          doc['history'] = [historico[dia] for dia in sorted(historico)][-730:]
          doc['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          caminho.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          primeiro = doc['history'][0]
          resumo = [
              '## Reconstrução concluída', '',
              f"Total de referência hoje: **{atual:,}**".replace(',', '.'),
              f"Dias reconstruídos: **{novos}**",
              f"Série agora começa em **{primeiro['date']}** com **{primeiro['followers']['Instagram']:,}**".replace(',', '.'),
              '', '| Dia | Entraram | Confere (follower_count) | Saíram | Saldo | Total reconstruído |',
              '|---|---:|---:|---:|---:|---:|'
          ]
          for item in saldos:
              conferencia = referencia.get(item['date'], '—')
              resumo.append(
                  f"| {item['date']} | {item['entraram']} | {conferencia} | {item['sairam']} "
                  f"| {item['saldo']} | {reconstruidos[item['date']]} |"
              )
          Path('resumo.md').write_text('\n'.join(resumo) + '\n', encoding='utf-8')
          PY
          cat resumo.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar
        run: |
          git add data/social-followers.json
          if git diff --cached --quiet -- data/social-followers.json; then
            echo 'Nada mudou.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: reconstruir histórico de seguidores a partir dos insights'
          git push
