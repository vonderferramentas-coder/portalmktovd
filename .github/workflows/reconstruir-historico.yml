name: Reconstruir histórico de seguidores

# Carga única. A Meta não guarda o total de seguidores ao longo do tempo, mas guarda,
# por dia, quantas contas entraram e quantas saíram. Sabendo o total de hoje, dá para
# caminhar para trás: total de ontem = total de hoje menos o saldo de hoje.
#
# As fronteiras de dia vêm do próprio follower_count (end_time às 07:00 UTC, meia-noite
# no fuso da conta), para que a janela consultada case exatamente com o dia da Meta.
#
# Os pontos reconstruídos ficam marcados com "source": "reconstruido" no arquivo, e
# nunca sobrescrevem um dia que o coletor já mediu de fato.

on:
  # Sem cron próprio: disparado só pelo Worker do Cloudflare (cloudflare-agendador.js, horário em
  # UTC). O cron do GitHub atrasa horas e, ao chegar tarde, cancelava runs na fila (ARQUITETURA, seção 23).
  workflow_dispatch:
    inputs:
      dias_extra:
        description: 'Dias a mais, além dos ~29 do follower_count, em que buscar entraram/saíram (0 = rotina diária)'
        type: string
        default: '0'

permissions:
  contents: write

# Serializa TODOS os workflows deste projeto que fazem git push num único grupo: evita duas
# execuções colidindo no mesmo commit/arquivo de dados (visto na prática entre a coleta da
# VONDER e da Ferramentas Gerais rodando perto uma da outra — retry sozinho não bastava
# quando o conflito era de conteúdo de verdade, não só "não estava atualizado"). Uma
# execução espera a outra terminar em vez de tentar em paralelo e falhar.
concurrency:
  group: portal-dados-git-push
  cancel-in-progress: false

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Coletar saldo diário na Meta
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ID: '17841403154695997'
          DIAS_EXTRA_INPUT: ${{ inputs.dias_extra }}
        run: |
          set -euo pipefail
          API="https://graph.facebook.com/v26.0"
          AUTH="Authorization: Bearer $META_PAGE_ACCESS_TOKEN"

          # Total de agora: é a âncora de onde a caminhada para trás começa.
          curl -sS --fail -H "$AUTH" "$API/$META_INSTAGRAM_ID?fields=followers_count" -o atual.json
          jq -er '.followers_count | numbers' atual.json > /dev/null

          # Fronteiras de dia autoritativas, direto da Meta.
          SINCE="$(date -u -d '29 days ago' +%s)"
          UNTIL="$(date -u -d 'yesterday' +%s)"
          curl -sS --fail -H "$AUTH" \
            "$API/$META_INSTAGRAM_ID/insights?metric=follower_count&period=day&since=$SINCE&until=$UNTIL" \
            -o fronteiras.json
          curl -sS --fail -H "$AUTH" \
            "$API/$META_INSTAGRAM_ID/insights?metric=reach&period=day&since=$SINCE&until=$UNTIL" \
            -o alcance.json

          jq -r '.data[0].values[].end_time' fronteiras.json > limites.txt
          echo "Dias retornados pela Meta: $(wc -l < limites.txt)"

          # O follower_count só alcança 30 dias, mas o follows_and_unfollows devolve dias bem mais antigos
          # (conferido em 03/11/2026 contra a exportação do Business Suite). Para voltar além disso, as
          # fronteiras anteriores são calculadas à meia-noite do fuso da conta (Pacífico, o mesmo que
          # explica o end_time às 07:00 UTC no horário de verão) e entram antes das que a Meta devolveu.
          DIAS_EXTRA="${DIAS_EXTRA_INPUT:-0}"
          case "$DIAS_EXTRA" in ''|*[!0-9]*) echo "dias_extra inválido: $DIAS_EXTRA"; exit 1;; esac
          # uma consulta à Meta por dia, em série, com o token compartilhado com os outros coletores
          [ "$DIAS_EXTRA" -le 150 ] || { echo "dias_extra acima de 150: $DIAS_EXTRA"; exit 1; }
          if [ "$DIAS_EXTRA" -gt 0 ]; then
            python3 - "$DIAS_EXTRA" <<'PY'
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          fuso = ZoneInfo('America/Los_Angeles')
          # Confere a suposição de fuso nas fronteiras que a Meta devolveu (~29 dias, que incluem a troca do
          # horário de verão): se alguma não cair na meia-noite do Pacífico, as extras sairiam deslocadas.
          reais = [datetime.strptime(linha, '%Y-%m-%dT%H:%M:%S%z').astimezone(fuso) for linha in Path('limites.txt').read_text().split()]
          if any(item.hour or item.minute for item in reais):
              raise SystemExit('As fronteiras da Meta não caem na meia-noite de America/Los_Angeles; dias_extra recusado.')
          primeira = reais[0]
          meia_noite = primeira.replace(hour=0, minute=0, second=0, tzinfo=None)  # aritmética no relógio local: mantém a meia-noite no horário de verão
          extras = [(meia_noite - timedelta(days=k)).replace(tzinfo=fuso).astimezone(timezone.utc) for k in range(int(sys.argv[1]), 0, -1)]
          Path('extras.txt').write_text(''.join(item.strftime('%Y-%m-%dT%H:%M:%S+0000') + chr(10) for item in extras))
          Path('limites.txt').write_text(Path('extras.txt').read_text() + Path('limites.txt').read_text())
          PY
            echo "Dias extras além do follower_count: $DIAS_EXTRA (total de fronteiras: $(wc -l < limites.txt))"
          fi

          # Referência independente: o follower_count mede as mesmas entradas por dia.
          # Serve para conferir a reconstrução antes de gravar qualquer coisa.
          jq '[.data[0].values[]?.value] | add // 0' fronteiras.json > entradas_referencia.txt

          # Um dia por consulta: com janela de 24h a resposta traz o total daquele dia,
          # separado em quem entrou (FOLLOWER) e quem saiu (NON_FOLLOWER).
          # Os '?' são necessários: num dia sem dados a Meta devolve "data": [], e sem eles
          # o jq aborta ao iterar sobre null, derrubando a coleta inteira por causa de um
          # único dia vazio. Lê a variável $resposta de quem chama.
          extrair() {
            printf '%s' "$resposta" \
              | jq -r --arg tipo "$1" '[.data[]?.total_value?.breakdowns[]?.results[]? | select(.dimension_values[0]==$tipo) | .value] | first // empty' \
              2>/dev/null || true
          }

          echo '[]' > saldos.json
          anterior=''
          while read -r limite; do
            fim="$(date -u -d "$limite" +%s)"
            if [ -n "$anterior" ]; then
              # +1 segundo: o 'until' da Meta é inclusivo, então uma janela que começa
              # exatamente na fronteira do dia anterior devolve dois dias somados.
              inicio=$((anterior + 1))
              resposta="$(curl -sS -H "$AUTH" \
                "$API/$META_INSTAGRAM_ID/insights?metric=follows_and_unfollows&period=day&metric_type=total_value&breakdown=follow_type&since=$inicio&until=$fim")"
              entraram="$(extrair FOLLOWER)"
              sairam="$(extrair NON_FOLLOWER)"
              if [ -n "$entraram" ] && [ -n "$sairam" ]; then
                dia="$(date -u -d "$limite" +%F)"
                jq --arg d "$dia" --argjson e "$entraram" --argjson s "$sairam" \
                  '. + [{date:$d, entraram:$e, sairam:$s, saldo:($e-$s)}]' saldos.json > tmp.json
                mv tmp.json saldos.json
              else
                echo "Sem dado utilizável para o dia que termina em $limite"
                printf 'Resposta recebida: %s\n' "${resposta:0:300}"
              fi
            fi
            anterior="$fim"
          done < limites.txt

          echo "Dias com saldo apurado: $(jq 'length' saldos.json)"

          # A âncora é o total de AGORA, mas o último dia da série terminou horas atrás.
          # Sem descontar o que entrou desde então, a curva inteira sobe um dia de ganho.
          echo '{}' > parcial.json
          if [ -n "$anterior" ]; then
            resposta="$(curl -sS -H "$AUTH" \
              "$API/$META_INSTAGRAM_ID/insights?metric=follows_and_unfollows&period=day&metric_type=total_value&breakdown=follow_type&since=$((anterior + 1))&until=$(date -u +%s)")"
            e="$(extrair FOLLOWER)"
            s="$(extrair NON_FOLLOWER)"
            if [ -n "$e" ] && [ -n "$s" ]; then
              jq -n --argjson e "$e" --argjson s "$s" '{entraram:$e, sairam:$s, saldo:($e-$s)}' > parcial.json
              echo "Saldo parcial de hoje: $((e - s))"
            else
              echo 'Saldo parcial de hoje indisponível; a âncora ficará com o desvio de um dia.'
            fi
          fi

      - name: Reconstruir os totais e mesclar
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          atual = json.loads(Path('atual.json').read_text())['followers_count']
          saldos = json.loads(Path('saldos.json').read_text())
          alcance = {item['end_time'][:10]: item['value'] for item in json.loads(Path('alcance.json').read_text()).get('data', [{}])[0].get('values', [])}
          caminho = Path('data/social-followers.json')
          doc = json.loads(caminho.read_text(encoding='utf-8')) if caminho.exists() else {'version': 1, 'history': []}

          # Conferência: o follower_count mede as entradas do mesmo dia por outro caminho.
          # Se os dois discordarem muito, a janela de consulta está errada — foi assim que
          # a primeira tentativa dobrou todos os números — e nada deve ser gravado.
          referencia = {
              item['end_time'][:10]: item['value']
              for item in json.loads(Path('fronteiras.json').read_text())['data'][0]['values']
          }

          # Nada é descartado antes de recalcular: os dias que esta execução refaz já são
          # sobrescritos mais abaixo (um dia 'reconstruido'/'estimado' nunca conta como medido).
          # Descartar de antemão todo dia de "referencia" apagava, a cada execução, o dia mais
          # antigo da janela (o follower_count traz um dia a mais que o follows_and_unfollows: o
          # primeiro não tem "anterior" para delimitar a consulta) e qualquer dia cuja consulta
          # falhasse. Como a Meta só devolve ~29 dias, o que sai da janela não volta mais — foi
          # assim que 01, 02 e 04/10/2026 perderam o Instagram e o crescimento líquido do mês
          # deixou de fechar com novos − saídas.
          historico = {item['date']: item for item in doc.get('history', [])}
          # Um dia faltando desloca o total de todos os dias anteriores a ele, porque a
          # caminhada para trás é encadeada. Melhor recusar do que publicar série torta.
          # A Meta pode devolver o último período ainda aberto com valor 0; ele não é
          # ausência de crescimento e não pode bloquear a reconstrução dos dias fechados.
          # dias além do follower_count (dias_extra) não têm 'referencia', mas também não podem faltar
          extras = {linha[:10] for linha in Path('extras.txt').read_text().split()} if Path('extras.txt').exists() else set()
          esperados = sorted({dia for dia, valor in referencia.items() if valor > 0} | extras)[1:]
          faltando = [dia for dia in esperados if dia not in {item['date'] for item in saldos}]

          # O insights de follows/unfollows atrasa até 48h, então o dia mais recente costuma
          # faltar — e um buraco trava a cadeia inteira. Quando o follower_count já tem as
          # ENTRADAS daquele dia, só as saídas precisam ser inferidas, pela proporção medida
          # nos demais dias. Vale para um ou dois dias; mais que isso deixa de ser um remendo
          # e vira uma série inventada, e aí é melhor recusar e esperar.
          proporcoes = sorted(item['sairam'] / item['entraram'] for item in saldos if item['entraram'])
          proporcao = proporcoes[len(proporcoes) // 2] if proporcoes else None
          estimados = []
          if faltando and proporcao is not None and len(faltando) <= 2:
              for dia in list(faltando):
                  entradas = referencia.get(dia)
                  if not entradas:
                      continue
                  saidas = round(entradas * proporcao)
                  saldos.append({'date': dia, 'entraram': entradas, 'sairam': saidas,
                                 'saldo': entradas - saidas, 'estimado': True})
                  estimados.append(dia)
                  faltando.remove(dia)

          divergentes = []
          for item in saldos:
              esperado = referencia.get(item['date'])
              if esperado is None or esperado == 0:
                  continue
              desvio = abs(item['entraram'] - esperado) / esperado
              if desvio > 0.15:
                  divergentes.append((item['date'], item['entraram'], esperado, desvio))

          if divergentes or faltando:
              linhas = ['## Reconstrução recusada', '']
              if faltando:
                  linhas += [
                      f'**{len(faltando)} dia(s) sem saldo apurado:** {", ".join(faltando[:10])}.',
                      'Como o total de cada dia é calculado a partir do dia seguinte, um buraco',
                      'desloca tudo o que vem antes dele.', ''
                  ]
              if divergentes:
                  linhas += [
                      'As entradas apuradas não batem com o `follower_count` do mesmo dia, que mede',
                      'a mesma coisa por outro caminho.', '',
                      '| Dia | follows_and_unfollows | follower_count | Desvio |', '|---|---:|---:|---:|'
                  ]
                  for dia, obtido, esperado, desvio in divergentes[:15]:
                      linhas.append(f'| {dia} | {obtido} | {esperado} | {desvio:.0%} |')
              linhas += ['', 'Nada foi gravado; o arquivo ficou como estava.']
              doc['history'] = [historico[dia] for dia in sorted(historico)]
              caminho.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              Path('resumo.md').write_text('\n'.join(linhas) + '\n', encoding='utf-8')
              raise SystemExit(0)

          # Caminha do dia mais recente para o mais antigo. O total do dia anterior é o
          # total do dia menos o saldo do dia seguinte.
          # Do fim do último dia da série até agora já houve crescimento. Descontá-lo evita
          # que a curva inteira suba um dia de ganho.
          parcial = json.loads(Path('parcial.json').read_text())
          ancora_exata = 'saldo' in parcial

          saldos.sort(key=lambda item: item['date'])
          total = atual - parcial.get('saldo', 0)
          reconstruidos = {}
          for item in reversed(saldos):
              reconstruidos[item['date']] = total
              total -= item['saldo']

          novos = 0
          metricas = {item['date']: item for item in saldos}
          for dia, valor in sorted(reconstruidos.items()):
              existente = historico.get(dia)
              medida = metricas[dia]
              insights = {
                  'follows': int(medida['entraram']),
                  'unfollows': int(medida['sairam']),
                  'net': int(medida['saldo']),
              }
              if dia in alcance:
                  insights['reach'] = int(alcance[dia])
              # Medição real mantém seu total; a ela são adicionados apenas os Insights.
              # A checagem é por rede, não só "o dia existe": um dia pode ter YouTube
              # fechado (workflow próprio) sem ter Instagram medido nesse dia — olhar só
              # a presença da entrada escondia esse buraco e nunca preenchia o Instagram
              # (foi o que aconteceu em 14/09/2026, quando só a coleta do Instagram/
              # Facebook falhou nesse dia específico). `dict(existente)` como base em
              # ambos os ramos preserva Facebook/YouTube já presentes; só o Instagram é
              # trocado pelo valor recém-calculado.
              tem_instagram_medido = bool(existente) \
                  and existente.get('followers', {}).get('Instagram') is not None \
                  and existente.get('source') not in ('reconstruido', 'estimado')
              entrada = dict(existente) if existente else {'date': dia}
              if not tem_instagram_medido and dia not in extras:  # dia extra só ganha os Insights: total reconstruído por tantos dias acumularia desvio
                  entrada['followers'] = dict(entrada.get('followers') or {})
                  entrada['followers']['Instagram'] = int(valor)
                  entrada['source'] = 'estimado' if dia in set(estimados) else 'reconstruido'
                  novos += 1
              entrada['insights'] = dict(entrada.get('insights') or {})
              entrada['insights']['Instagram'] = insights
              historico[dia] = entrada

          doc['version'] = 2
          doc['history'] = [historico[dia] for dia in sorted(historico)]
          doc['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          caminho.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # doc['history'][0] pode ser um dia mais antigo que só tem Facebook (a reconstrução
          # do Facebook cobre um período bem maior que os ~29 dias do Instagram aqui) — usar o
          # dia mais antigo que ESTA execução de fato reconstruiu (reconstruidos), não o mais
          # antigo do arquivo inteiro, senão ['followers']['Instagram'] nem sempre existe.
          primeiro_dia = min(reconstruidos)
          primeiro_valor = reconstruidos[primeiro_dia]
          resumo = [
              '## Reconstrução concluída', '',
              f"Total de referência hoje: **{atual:,}**".replace(',', '.'),
              (f"Saldo parcial de hoje descontado da âncora: **{parcial['saldo']}**"
               if ancora_exata else
               "⚠️ Saldo parcial de hoje indisponível: a série pode estar deslocada em até um dia de crescimento."),
              f"Dias reconstruídos: **{novos}**",
              (f"⚠️ Saídas estimadas em {len(estimados)} dia(s) ({', '.join(estimados)}), "
               f"pela proporção mediana de {proporcao:.1%} medida nos demais. "
               "Esses dias se corrigem sozinhos quando a Meta liberar o dado."
               if estimados else "Todos os dias vieram medidos."),
              f"Série agora começa em **{primeiro_dia}** com **{primeiro_valor:,}**".replace(',', '.'),
              '', '| Dia | Entraram | Confere (follower_count) | Saíram | Saldo | Total reconstruído |',
              '|---|---:|---:|---:|---:|---:|'
          ]
          for item in saldos:
              conferencia = referencia.get(item['date'], '—')
              marca = ' ⚠️ estimado' if item.get('estimado') else ''
              resumo.append(
                  f"| {item['date']}{marca} | {item['entraram']} | {conferencia} | {item['sairam']} "
                  f"| {item['saldo']} | {reconstruidos[item['date']]} |"
              )
          Path('resumo.md').write_text('\n'.join(resumo) + '\n', encoding='utf-8')
          PY
          cat resumo.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar
        run: |
          git add data/social-followers.json
          if git diff --cached --quiet -- data/social-followers.json; then
            echo 'Nada mudou.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: reconstruir histórico de seguidores a partir dos insights'
          # `git push` sozinho, sem retry, falhava direto sob concorrência (ex.: o job da
          # Ferramentas Gerais logo abaixo publicando no mesmo instante) — mesmo padrão de
          # retry com rebase (e --abort em conflito de verdade) já usado nos demais workflows.
          for tentativa in 1 2 3; do
            if git push; then break; fi
            echo "Push rejeitado (tentativa $tentativa/3), atualizando e tentando de novo..."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort
              echo 'Rebase conflitou — abortado, tentando de novo do zero.'
            fi
            [ "$tentativa" -eq 3 ] && exit 1
          done

  # Mesma reconstrução para a Ferramentas Gerais — job separado (isolamento entre marcas já vem
  # do próprio job, sem precisar de continue-on-error aqui: uma falha nesta reconstrução nunca
  # afeta o job da VONDER acima, que roda antes por causa do `needs`). O snapshot protegido no
  # Firestore não precisa de passo próprio: sync-meta-followers.yml roda a cada 15 min e já
  # republica data/social-followers-ferramentas-gerais.json de qualquer jeito.
  reconstruir-ferramentas-gerais:
    needs: reconstruir
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Coletar saldo diário na Meta (Ferramentas Gerais)
        env:
          META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS: ${{ secrets.META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS }}
          META_INSTAGRAM_ID: '17841404085550539'
          DIAS_EXTRA_INPUT: ${{ inputs.dias_extra }}
        run: |
          set -euo pipefail
          API="https://graph.facebook.com/v26.0"
          AUTH="Authorization: Bearer $META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS"

          curl -sS --fail -H "$AUTH" "$API/$META_INSTAGRAM_ID?fields=followers_count" -o atual.json
          jq -er '.followers_count | numbers' atual.json > /dev/null

          SINCE="$(date -u -d '29 days ago' +%s)"
          UNTIL="$(date -u -d 'yesterday' +%s)"
          curl -sS --fail -H "$AUTH" \
            "$API/$META_INSTAGRAM_ID/insights?metric=follower_count&period=day&since=$SINCE&until=$UNTIL" \
            -o fronteiras.json
          curl -sS --fail -H "$AUTH" \
            "$API/$META_INSTAGRAM_ID/insights?metric=reach&period=day&since=$SINCE&until=$UNTIL" \
            -o alcance.json

          jq -r '.data[0].values[].end_time' fronteiras.json > limites.txt
          echo "Dias retornados pela Meta: $(wc -l < limites.txt)"

          # O follower_count só alcança 30 dias, mas o follows_and_unfollows devolve dias bem mais antigos
          # (conferido em 03/11/2026 contra a exportação do Business Suite). Para voltar além disso, as
          # fronteiras anteriores são calculadas à meia-noite do fuso da conta (Pacífico, o mesmo que
          # explica o end_time às 07:00 UTC no horário de verão) e entram antes das que a Meta devolveu.
          DIAS_EXTRA="${DIAS_EXTRA_INPUT:-0}"
          case "$DIAS_EXTRA" in ''|*[!0-9]*) echo "dias_extra inválido: $DIAS_EXTRA"; exit 1;; esac
          # uma consulta à Meta por dia, em série, com o token compartilhado com os outros coletores
          [ "$DIAS_EXTRA" -le 150 ] || { echo "dias_extra acima de 150: $DIAS_EXTRA"; exit 1; }
          if [ "$DIAS_EXTRA" -gt 0 ]; then
            python3 - "$DIAS_EXTRA" <<'PY'
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          fuso = ZoneInfo('America/Los_Angeles')
          # Confere a suposição de fuso nas fronteiras que a Meta devolveu (~29 dias, que incluem a troca do
          # horário de verão): se alguma não cair na meia-noite do Pacífico, as extras sairiam deslocadas.
          reais = [datetime.strptime(linha, '%Y-%m-%dT%H:%M:%S%z').astimezone(fuso) for linha in Path('limites.txt').read_text().split()]
          if any(item.hour or item.minute for item in reais):
              raise SystemExit('As fronteiras da Meta não caem na meia-noite de America/Los_Angeles; dias_extra recusado.')
          primeira = reais[0]
          meia_noite = primeira.replace(hour=0, minute=0, second=0, tzinfo=None)  # aritmética no relógio local: mantém a meia-noite no horário de verão
          extras = [(meia_noite - timedelta(days=k)).replace(tzinfo=fuso).astimezone(timezone.utc) for k in range(int(sys.argv[1]), 0, -1)]
          Path('extras.txt').write_text(''.join(item.strftime('%Y-%m-%dT%H:%M:%S+0000') + chr(10) for item in extras))
          Path('limites.txt').write_text(Path('extras.txt').read_text() + Path('limites.txt').read_text())
          PY
            echo "Dias extras além do follower_count: $DIAS_EXTRA (total de fronteiras: $(wc -l < limites.txt))"
          fi

          jq '[.data[0].values[]?.value] | add // 0' fronteiras.json > entradas_referencia.txt

          extrair() {
            printf '%s' "$resposta" \
              | jq -r --arg tipo "$1" '[.data[]?.total_value?.breakdowns[]?.results[]? | select(.dimension_values[0]==$tipo) | .value] | first // empty' \
              2>/dev/null || true
          }

          echo '[]' > saldos.json
          anterior=''
          while read -r limite; do
            fim="$(date -u -d "$limite" +%s)"
            if [ -n "$anterior" ]; then
              inicio=$((anterior + 1))
              resposta="$(curl -sS -H "$AUTH" \
                "$API/$META_INSTAGRAM_ID/insights?metric=follows_and_unfollows&period=day&metric_type=total_value&breakdown=follow_type&since=$inicio&until=$fim")"
              entraram="$(extrair FOLLOWER)"
              sairam="$(extrair NON_FOLLOWER)"
              if [ -n "$entraram" ] && [ -n "$sairam" ]; then
                dia="$(date -u -d "$limite" +%F)"
                jq --arg d "$dia" --argjson e "$entraram" --argjson s "$sairam" \
                  '. + [{date:$d, entraram:$e, sairam:$s, saldo:($e-$s)}]' saldos.json > tmp.json
                mv tmp.json saldos.json
              else
                echo "Sem dado utilizável para o dia que termina em $limite"
                printf 'Resposta recebida: %s\n' "${resposta:0:300}"
              fi
            fi
            anterior="$fim"
          done < limites.txt

          echo "Dias com saldo apurado: $(jq 'length' saldos.json)"

          echo '{}' > parcial.json
          if [ -n "$anterior" ]; then
            resposta="$(curl -sS -H "$AUTH" \
              "$API/$META_INSTAGRAM_ID/insights?metric=follows_and_unfollows&period=day&metric_type=total_value&breakdown=follow_type&since=$((anterior + 1))&until=$(date -u +%s)")"
            e="$(extrair FOLLOWER)"
            s="$(extrair NON_FOLLOWER)"
            if [ -n "$e" ] && [ -n "$s" ]; then
              jq -n --argjson e "$e" --argjson s "$s" '{entraram:$e, sairam:$s, saldo:($e-$s)}' > parcial.json
              echo "Saldo parcial de hoje: $((e - s))"
            else
              echo 'Saldo parcial de hoje indisponível; a âncora ficará com o desvio de um dia.'
            fi
          fi

      - name: Reconstruir os totais e mesclar (Ferramentas Gerais)
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          atual = json.loads(Path('atual.json').read_text())['followers_count']
          saldos = json.loads(Path('saldos.json').read_text())
          alcance = {item['end_time'][:10]: item['value'] for item in json.loads(Path('alcance.json').read_text()).get('data', [{}])[0].get('values', [])}
          caminho = Path('data/social-followers-ferramentas-gerais.json')
          doc = json.loads(caminho.read_text(encoding='utf-8')) if caminho.exists() else {'version': 1, 'history': []}

          referencia = {
              item['end_time'][:10]: item['value']
              for item in json.loads(Path('fronteiras.json').read_text())['data'][0]['values']
          }

          # Sem descarte prévio: ver a explicação no job da VONDER (o dia mais antigo da janela
          # era apagado a cada execução e nunca mais recalculado).
          historico = {item['date']: item for item in doc.get('history', [])}
          extras = {linha[:10] for linha in Path('extras.txt').read_text().split()} if Path('extras.txt').exists() else set()
          esperados = sorted({dia for dia, valor in referencia.items() if valor > 0} | extras)[1:]
          faltando = [dia for dia in esperados if dia not in {item['date'] for item in saldos}]

          proporcoes = sorted(item['sairam'] / item['entraram'] for item in saldos if item['entraram'])
          proporcao = proporcoes[len(proporcoes) // 2] if proporcoes else None
          estimados = []
          if faltando and proporcao is not None and len(faltando) <= 2:
              for dia in list(faltando):
                  entradas = referencia.get(dia)
                  if not entradas:
                      continue
                  saidas = round(entradas * proporcao)
                  saldos.append({'date': dia, 'entraram': entradas, 'sairam': saidas,
                                 'saldo': entradas - saidas, 'estimado': True})
                  estimados.append(dia)
                  faltando.remove(dia)

          divergentes = []
          for item in saldos:
              esperado = referencia.get(item['date'])
              if esperado is None or esperado == 0:
                  continue
              desvio = abs(item['entraram'] - esperado) / esperado
              if desvio > 0.15:
                  divergentes.append((item['date'], item['entraram'], esperado, desvio))

          if divergentes or faltando:
              linhas = ['## Reconstrução recusada (Ferramentas Gerais)', '']
              if faltando:
                  linhas += [f'**{len(faltando)} dia(s) sem saldo apurado:** {", ".join(faltando[:10])}.', '']
              if divergentes:
                  linhas += ['Entradas não batem com o `follower_count` do mesmo dia.', '']
              linhas += ['Nada foi gravado; o arquivo ficou como estava.']
              doc['history'] = [historico[dia] for dia in sorted(historico)]
              caminho.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              Path('resumo-fg.md').write_text('\n'.join(linhas) + '\n', encoding='utf-8')
              raise SystemExit(0)

          parcial = json.loads(Path('parcial.json').read_text())
          ancora_exata = 'saldo' in parcial

          saldos.sort(key=lambda item: item['date'])
          total = atual - parcial.get('saldo', 0)
          reconstruidos = {}
          for item in reversed(saldos):
              reconstruidos[item['date']] = total
              total -= item['saldo']

          novos = 0
          metricas = {item['date']: item for item in saldos}
          for dia, valor in sorted(reconstruidos.items()):
              existente = historico.get(dia)
              medida = metricas[dia]
              insights = {
                  'follows': int(medida['entraram']),
                  'unfollows': int(medida['sairam']),
                  'net': int(medida['saldo']),
              }
              if dia in alcance:
                  insights['reach'] = int(alcance[dia])
              # Ver o comentário equivalente no job da VONDER acima: checagem por rede
              # (Instagram medido nesse dia?), não só "o dia existe" — preserva
              # Facebook/YouTube já presentes na entrada.
              tem_instagram_medido = bool(existente) \
                  and existente.get('followers', {}).get('Instagram') is not None \
                  and existente.get('source') not in ('reconstruido', 'estimado')
              entrada = dict(existente) if existente else {'date': dia}
              if not tem_instagram_medido and dia not in extras:  # dia extra só ganha os Insights
                  entrada['followers'] = dict(entrada.get('followers') or {})
                  entrada['followers']['Instagram'] = int(valor)
                  entrada['source'] = 'estimado' if dia in set(estimados) else 'reconstruido'
                  novos += 1
              entrada['insights'] = dict(entrada.get('insights') or {})
              entrada['insights']['Instagram'] = insights
              historico[dia] = entrada

          doc['version'] = 2
          doc['history'] = [historico[dia] for dia in sorted(historico)]
          doc['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          caminho.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Mesmo cuidado do job da VONDER acima: usar o dia mais antigo que esta execução
          # de fato reconstruiu, não doc['history'][0] (pode ser um dia só-Facebook).
          primeiro_dia = min(reconstruidos)
          primeiro_valor = reconstruidos[primeiro_dia]
          resumo = [
              '## Reconstrução concluída (Ferramentas Gerais)', '',
              f"Total de referência hoje: **{atual:,}**".replace(',', '.'),
              f"Dias reconstruídos: **{novos}**",
              f"Série agora começa em **{primeiro_dia}** com **{primeiro_valor:,}**".replace(',', '.'),
          ]
          Path('resumo-fg.md').write_text('\n'.join(resumo) + '\n', encoding='utf-8')
          PY
          cat resumo-fg.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar (Ferramentas Gerais)
        run: |
          git add data/social-followers-ferramentas-gerais.json
          if git diff --cached --quiet -- data/social-followers-ferramentas-gerais.json; then
            echo 'Nada mudou.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: reconstruir histórico de seguidores a partir dos insights (Ferramentas Gerais)'
          # `git rebase` sem o `if !` mataria o script na hora (run: roda com `bash -e` por
          # padrão), derrubando a tentativa 1/3 antes mesmo de chegar na 2/3 — por isso o `if !`
          # e o `--abort` explícito em caso de conflito de verdade (mais de um workflow desta
          # marca escrevendo no mesmo arquivo perto um do outro).
          for tentativa in 1 2 3; do
            if git push; then break; fi
            echo "Push rejeitado (tentativa $tentativa/3), atualizando e tentando de novo..."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort
              echo 'Rebase conflitou — abortado, tentando de novo do zero.'
            fi
            [ "$tentativa" -eq 3 ] && exit 1
          done
