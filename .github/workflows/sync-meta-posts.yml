name: Sincronizar posts do Instagram

# Mantém frescos (thumbnail + métricas) os ~30 posts mais recentes do Instagram, com curtidas,
# comentários e as métricas de /insights (interações totais, visualizações, salvamentos — ver
# diagnostico-meta-posts.yml, que confirmou que o token atual alcança tudo isso sem escopo
# extra). Faz MERGE com data/social-posts.json em vez de sobrescrever: o restante do histórico
# (além desses ~30) vem de reconstruir-historico-posts.yml, que roda uma vez e só adiciona
# posts que ainda não existem no arquivo — sem isso, filtrar o ranking "Melhores posts" por
# "Este ano"/"Desde o início" só reordenava os mesmos ~30 posts recentes, e o "melhor post do
# ano" acabava sempre sendo um post recente por falta de dado, não por ele realmente ser o
# melhor.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Coletar posts e métricas
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ID: '17841403154695997'
        run: |
          set -euo pipefail
          test -n "$META_PAGE_ACCESS_TOKEN"
          pip install --quiet Pillow
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from archive_post_thumbnails import archive_thumbnails

          token = os.environ['META_PAGE_ACCESS_TOKEN']
          ig_id = os.environ['META_INSTAGRAM_ID']
          api = 'https://graph.facebook.com/v26.0'

          def get(url):
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          def metric_value(insights, name):
              for entry in insights.get('data', []):
                  if entry.get('name') == name:
                      values = entry.get('values') or []
                      if values:
                          return values[0].get('value')
              return None

          media_fields = 'id,caption,media_type,media_product_type,permalink,timestamp,like_count,comments_count,media_url,thumbnail_url'
          listing = get(f'{api}/{ig_id}/media?fields={media_fields}&limit=30')
          items = listing.get('data', [])
          if not items:
              raise SystemExit('A Meta não retornou nenhum post — nada de errado a corrigir, mas o sinal vale a pena investigar.')

          fetched = []
          falhas = 0
          for item in items:
              media_id = item['id']
              total_interactions = views = saved = None
              try:
                  insights = get(f'{api}/{media_id}/insights?metric=total_interactions,views,saved')
                  total_interactions = metric_value(insights, 'total_interactions')
                  views = metric_value(insights, 'views')
                  saved = metric_value(insights, 'saved')
              except urllib.error.HTTPError:
                  # Posts muito antigos ou tipos de mídia sem essas métricas ficam sem elas —
                  # não trava a coleta dos demais, só esse post fica com curtidas/comentários só.
                  falhas += 1
              fetched.append({
                  'id': media_id,
                  # Legenda completa (sem corte): só os ~30 posts recentes passam por aqui a
                  # cada rodada, então o custo de armazenamento é desprezível — o corte que
                  # protege o limite de 1 MiB do Firestore fica só no histórico em massa (ver
                  # MAX_CAPTION_CHARS em reconstruir-historico-posts.yml).
                  'caption': item.get('caption') or '',
                  'mediaType': item.get('media_type'),
                  'mediaProductType': item.get('media_product_type'),
                  'permalink': item.get('permalink'),
                  'thumbnailUrl': item.get('thumbnail_url') or item.get('media_url'),
                  'timestamp': item.get('timestamp'),
                  'likeCount': item.get('like_count', 0) or 0,
                  'commentsCount': item.get('comments_count', 0) or 0,
                  'totalInteractions': total_interactions,
                  'views': views,
                  'saved': saved,
              })
              time.sleep(0.2)  # não martela a API em sequência

          # Mescla por cima do histórico já acumulado (ver reconstruir-historico-posts.yml):
          # só os ids que vieram nesta página (os ~30 mais recentes) são atualizados — o resto
          # do histórico permanece intocado, exatamente como foi reconstruído.
          path = Path('data/social-posts.json')
          existing = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'version': 1, 'posts': []}
          by_id = {post['id']: post for post in existing.get('posts', [])}
          for post in fetched:
              by_id[post['id']] = post
          merged = sorted(by_id.values(), key=lambda post: post.get('timestamp') or '', reverse=True)

          # Guarda uma cópia permanente da miniatura de qualquer post que ainda não tenha uma
          # (normalmente só os que acabaram de entrar nesta rodada) — sem isso, quando o post
          # sair da janela dos ~30 recentes e parar de ser atualizado aqui, a URL assinada da
          # Meta guardada por último eventualmente expira e a miniatura quebra sem re-coleta.
          archive_thumbnails(merged)

          document = {
              'version': 1,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'posts': merged,
          }
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Atualizados {len(fetched)} posts recentes ({falhas} sem insights de post); histórico acumulado: {len(merged)} posts.')
          PY

      - name: Publicar dados atualizados
        run: |
          git add data/social-posts.json data/social-posts-thumbnails
          if git diff --cached --quiet -- data/social-posts.json data/social-posts-thumbnails; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: atualizar posts do Instagram'
          # reconstruir-historico-posts.yml pode levar dezenas de minutos paginando o histórico
          # inteiro e também grava neste mesmo arquivo — um push rejeitado por não estar
          # atualizado tenta de novo com rebase antes de desistir (mesmo padrão de
          # sync-meta-followers.yml), em vez de perder esta rodada de coleta.
          for tentativa in 1 2 3; do
            if git push; then break; fi
            echo "Push rejeitado (tentativa $tentativa/3), atualizando e tentando de novo..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            [ "$tentativa" -eq 3 ] && exit 1
          done

      # Mesmo padrão de sync-meta-followers.yml: o painel só lê o Firestore, nunca o JSON
      # público direto — ver docs/ARQUITETURA-E-INTEGRACOES.md, "Migração do painel de seguidores".
      # A publicação em si (com sharding para não estourar 1 MiB por documento) está em
      # scripts/publish_posts_firestore.py, compartilhado com reconstruir-historico-posts.yml.
      - name: Publicar posts no Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo '::warning::FIREBASE_SERVICE_ACCOUNT_KEY não configurado — pulando a gravação em portalStore/posts-vonder-v1. O painel continuará mostrando "Aguardando coleta" até o secret ser cadastrado.'
            exit 0
          fi
          pip install --quiet firebase-admin
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from publish_posts_firestore import publish

          published = json.loads(Path('data/social-posts.json').read_text(encoding='utf-8'))
          publish('posts-vonder-v1', published, os.environ['FIREBASE_SERVICE_ACCOUNT_KEY'])
          PY

  # Segunda marca no MESMO agendamento acima — nunca um cron/workflow novo (mesmo raciocínio
  # documentado em sync-meta-followers.yml). Job separado com `continue-on-error` no passo de
  # rede para que uma falha da API pra essa marca nunca derrube a coleta da VONDER acima.
  sync-posts-ferramentas-gerais:
    needs: sync-posts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site
        uses: actions/checkout@v4

      - name: Coletar posts e métricas (Ferramentas Gerais)
        id: coletaFg
        continue-on-error: true
        env:
          META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS: ${{ secrets.META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS }}
          META_INSTAGRAM_ID: '17841404085550539'
        run: |
          set -euo pipefail
          test -n "$META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS"
          pip install --quiet Pillow
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from archive_post_thumbnails import archive_thumbnails

          token = os.environ['META_PAGE_ACCESS_TOKEN_FERRAMENTAS_GERAIS']
          ig_id = os.environ['META_INSTAGRAM_ID']
          api = 'https://graph.facebook.com/v26.0'

          def get(url):
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}'})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          def metric_value(insights, name):
              for entry in insights.get('data', []):
                  if entry.get('name') == name:
                      values = entry.get('values') or []
                      if values:
                          return values[0].get('value')
              return None

          media_fields = 'id,caption,media_type,media_product_type,permalink,timestamp,like_count,comments_count,media_url,thumbnail_url'
          listing = get(f'{api}/{ig_id}/media?fields={media_fields}&limit=30')
          items = listing.get('data', [])
          if not items:
              raise SystemExit('A Meta não retornou nenhum post — nada de errado a corrigir, mas o sinal vale a pena investigar.')

          fetched = []
          falhas = 0
          for item in items:
              media_id = item['id']
              total_interactions = views = saved = None
              try:
                  insights = get(f'{api}/{media_id}/insights?metric=total_interactions,views,saved')
                  total_interactions = metric_value(insights, 'total_interactions')
                  views = metric_value(insights, 'views')
                  saved = metric_value(insights, 'saved')
              except urllib.error.HTTPError:
                  falhas += 1
              fetched.append({
                  'id': media_id,
                  'caption': item.get('caption') or '',
                  'mediaType': item.get('media_type'),
                  'mediaProductType': item.get('media_product_type'),
                  'permalink': item.get('permalink'),
                  'thumbnailUrl': item.get('thumbnail_url') or item.get('media_url'),
                  'timestamp': item.get('timestamp'),
                  'likeCount': item.get('like_count', 0) or 0,
                  'commentsCount': item.get('comments_count', 0) or 0,
                  'totalInteractions': total_interactions,
                  'views': views,
                  'saved': saved,
              })
              time.sleep(0.2)

          path = Path('data/social-posts-ferramentas-gerais.json')
          existing = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {'version': 1, 'posts': []}
          by_id = {post['id']: post for post in existing.get('posts', [])}
          for post in fetched:
              by_id[post['id']] = post
          merged = sorted(by_id.values(), key=lambda post: post.get('timestamp') or '', reverse=True)

          # Mesmo diretório compartilhado de miniaturas que a VONDER usa (data/social-posts-thumbnails):
          # o nome do arquivo é o id do post, que é único na Graph API mesmo entre contas diferentes,
          # então não há risco de uma marca sobrescrever a miniatura da outra.
          archive_thumbnails(merged)

          document = {
              'version': 1,
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'posts': merged,
          }
          path.write_text(json.dumps(document, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Atualizados {len(fetched)} posts recentes ({falhas} sem insights de post); histórico acumulado: {len(merged)} posts.')
          PY

      - name: Publicar dados atualizados (Ferramentas Gerais)
        if: steps.coletaFg.outcome == 'success'
        run: |
          git add data/social-posts-ferramentas-gerais.json data/social-posts-thumbnails
          if git diff --cached --quiet -- data/social-posts-ferramentas-gerais.json data/social-posts-thumbnails; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: atualizar posts do Instagram (Ferramentas Gerais)'
          for tentativa in 1 2 3; do
            if git push; then break; fi
            echo "Push rejeitado (tentativa $tentativa/3), atualizando e tentando de novo..."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort
              echo 'Rebase conflitou — abortado, tentando de novo do zero.'
            fi
            [ "$tentativa" -eq 3 ] && exit 1
          done

      - name: Publicar posts no Firestore (Ferramentas Gerais)
        if: steps.coletaFg.outcome == 'success'
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo '::warning::FIREBASE_SERVICE_ACCOUNT_KEY não configurado — pulando a gravação em portalStore/posts-ferramentas-gerais-v1.'
            exit 0
          fi
          pip install --quiet firebase-admin
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from publish_posts_firestore import publish

          published = json.loads(Path('data/social-posts-ferramentas-gerais.json').read_text(encoding='utf-8'))
          publish('posts-ferramentas-gerais-v1', published, os.environ['FIREBASE_SERVICE_ACCOUNT_KEY'])
          PY
